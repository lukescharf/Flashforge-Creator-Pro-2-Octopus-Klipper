#####################################################################
#   Calibration
#####################################################################

[gcode_macro Z_ENDSTOP_CALIBRATE]
# Prepare the bed and both toolheads before starting Klipper's interactive
# Z-endstop calibration. The original command is retained under the name
# Z_ENDSTOP_CALIBRATE_BASE.
#
# Usage: Z_ENDSTOP_CALIBRATE (no parameters)
# Prerequisites: select absolute positioning (G90), with no print running
# and a clear build plate. Mode changes must be unlocked
# (_FFCP2.mode_lock=False) so mirror mode can be selected.
#
# Sequence: home only if needed, move to Z=5 for clearance, then center both
# heads via _POSITION_CENTER in Motion.cfg and run the original calibration.
# Run G28 explicitly first after moving axes by hand or adjusting the endstop.
# The positioning helper selects MIRROR mode unless _FFCP2.mode already
# reports MIRROR; this assumes the tracked and actual carriage modes agree.
# Previous tool selection, print mode, and position are not restored afterward.
#
# Use TESTZ for adjustments, then ACCEPT or ABORT. SAVE_CONFIG persists
# an accepted calibration result and restarts Klipper.
description: Position both toolheads and start Z-endstop calibration
rename_existing: Z_ENDSTOP_CALIBRATE_BASE
gcode:
    # Ensure all axes are homed before the first move.
    _CG28

    # Provide bed clearance before moving the toolheads.
    G0 Z5

    # Center both toolheads for manual nozzle-height checks.
    _POSITION_CENTER

    # Delegate the interactive calibration to Klipper.
    Z_ENDSTOP_CALIBRATE_BASE
