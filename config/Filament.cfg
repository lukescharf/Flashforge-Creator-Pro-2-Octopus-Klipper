#####################################################################
#   Filament Management
#####################################################################


[gcode_macro LOAD_FILAMENT]
# Heat and load filament when print_stats does not report an active print.
#
# Usage: LOAD_FILAMENT (no parameters)
# Behavior: home if needed, move to the loading position, wait for the active
# nozzle, then request E60 at 200 mm/min and wait for movement completion.
# State: use G91 for relative moves and finish in G90; do not restore the
# caller's positioning mode, feed rate, position, or heater targets.
# Safety: use absolute positioning and clear travel for homing/purging. Pause
# before invoking during a print. COPY/MIRROR synchronization and T1 heating
# are not handled separately.
description: Heat and load filament outside an active print
gcode:
    # Optional diagnostic: uncomment to report the state used by the guard.
    # RESPOND TYPE=echo MSG="DEBUG: LOAD_FILAMENT: state={printer.print_stats.state}"

    {% if printer.print_stats.state != "printing" %}
        # Ensure printer is set up for loading
        _MOTORS_ACTIVE_BARRIER
        # Find a safe place to poop; FIXME: Ensure that pause/resume puts
        # everything back where it belongs
        _POSITION_FILAMENTLOAD
        # Safe temperature to extude
        _NOZZLE_HOT_ACTIVE_BARRIER

        # Extrude
        RESPOND TYPE=echo MSG="Filament loading..."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament loading
        {% endif %}
        G91
        # Grab the filament and try to eject enough of it to just barely get
        # rid of the old color.
        G1 E60 F200
        G90
        M400
        RESPOND TYPE=echo MSG="Filament loading completed."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament loaded
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="Cannot load filament while printing; pause first."
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
# Heat and unload filament when print_stats does not report an active print.
#
# Usage: UNLOAD_FILAMENT (no parameters)
# Behavior: home if needed, move to the loading position, wait for the active
# nozzle, then request E+15 at 200 mm/min and E-45 at 600 mm/min; wait for moves.
# State: use G91 for relative moves and finish in G90; do not restore the
# caller's positioning mode, feed rate, position, or heater targets.
# Safety: use absolute positioning and clear travel for homing/purging. Pause
# before invoking during a print. COPY/MIRROR synchronization and T1 heating
# are not handled separately.
description: Heat and unload filament outside an active print
gcode:
    {% if printer.print_stats.state != "printing" %}
        # Ensure printer is set up for loading
        _MOTORS_ACTIVE_BARRIER
        # Find a safe place to poop; FIXME: Ensure that pause/resume puts
        # everything back where it belongs
        _POSITION_FILAMENTLOAD
        _NOZZLE_HOT_ACTIVE_BARRIER

        # Retract
        RESPOND TYPE=echo MSG="Filament unloading..."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament unloading
        {% endif %}
        G91
        # Extrude any heat-creeped filament that might be in the hotend.
        G1 E+15 F200
        # Eject the filament as fast as we can
        G1 E-45 F600
        G90
        M400
        RESPOND TYPE=echo MSG="Filament unloading completed."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament unloaded
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="Cannot unload filament while printing; pause first."
    {% endif %}


[gcode_macro PRIME_NOZZLE_ACTIVE]
# Heat the active nozzle, request a purge, then park the active carriage(s).
# Usage: PRIME_NOZZLE_ACTIVE (no parameters)
# Behavior: home if needed; use _POSITION_FILAMENTLOAD and the active-nozzle
# temperature barrier, then request E30 at 150 mm/min without setting M82/M83.
# State: leave position, heater target, and feed rate changed; no caller-state
# restoration. Safety: clear travel and purge area; COPY/MIRROR support remains
# incomplete, including assurance that the synchronized T1 nozzle is hot.
description: Prime the active nozzle. Usage: PRIME_NOZZLE_ACTIVE
gcode:
    # FIXME: support for COPY and MIRROR modes.
    _MOTORS_ACTIVE_BARRIER
    _POSITION_FILAMENTLOAD
    _NOZZLE_HOT_ACTIVE_BARRIER

    # Poop
    G1 E30 F150

    # Park
    PARK_ACTIVE


[gcode_macro CLEAN_NOZZLE_ACTIVE]
# Heat the active nozzle and alternate between park and loading positions.
#
# Usage: CLEAN_NOZZLE_ACTIVE S3
# Parameters: S is the number of cycles, converted to int; default 3. Zero or
# negative counts run no cycles, but homing/heating helpers are still invoked.
# State: no overall save/restore; heater target, position, and feed rate remain
# changed. Preconditions: absolute positioning, clear motion/purge area.
# Safety: may home; COPY/MIRROR synchronization and T1 heating are incomplete.
description: Clean the active nozzle. Usage: CLEAN_NOZZLE_ACTIVE [S<count>]
gcode:
    # FIXME: support for COPY and MIRROR modes.
    {% set clean_count = params.S | default(3) | int %}

    _MOTORS_ACTIVE_BARRIER
    _NOZZLE_HOT_ACTIVE_BARRIER

    # Perform the cleaning motion
    {% for i in range(clean_count) %}
        PARK_ACTIVE
        _POSITION_FILAMENTLOAD
    {% endfor %}


[gcode_macro G12]
# Compatibility entry point; forward all parameters to CLEAN_NOZZLE_ACTIVE.
description: Clean the active nozzle. Usage: G12 [S<count>]
gcode:
    CLEAN_NOZZLE_ACTIVE {rawparams}


#####################################################################
#   Priming
#####################################################################


[gcode_macro PRIME_LINE]
# Draw a priming line using the currently selected print mode.
#
# Usage: PRIME_LINE X1=20 X2=70 Y=0 Z=0.3 F=1200 FLOW=0.075
# Parameters:
#   X1, X2: Line start/end X in mm. Defaults: 20, 70.
#   Y, Z: Line position/height in mm. Defaults: 0, 0.3.
#   F: Extrusion move feed rate in mm/min. Default: 1200.
#   FLOW: Filament mm per line mm. Default: 0.075.
#   E: Override filament length in mm; default abs(X2 - X1) * FLOW.
# Behavior: use absolute XYZ and relative extrusion; lift 1 mm after the line.
# State: restore parsing state with MOVE=0; leave position changed. No retraction,
# homing, tool selection, heating, or temperature wait is performed here.
# Safety: home first, heat both nozzles if synchronized, and keep the entire
# line within the selected mode's safe area. Parameters have no bounds checks.
description: Draw a priming line for the active print mode
gcode:
    # Call after the axes are homed and the nozzle(s) are at temperature.
    # One line is enough for every mode that uses this macro:
    # T0/T1 single-tool: only the active nozzle moves.
    # MIRROR/COPY: the second nozzle follows automatically.
    #
    # Keep X1..X2 inside the safe overlap of all four modes.  With the
    # current carriage geometry, X=70 is still more than safe_distance away
    # from its mirror partner (T1 is at 199-X in mirror mode).
    {% set x1 = params.X1 | default(20) | float %}
    {% set x2 = params.X2 | default(70) | float %}
    {% set y = params.Y | default(0) | float %}
    {% set z = params.Z | default(0.3) | float %}
    {% set f = params.F | default(1200) | float %}
    {% set flow = params.FLOW | default(0.075) | float %}
    {% set travel_f = printer.toolhead.max_velocity * 60.0 %}
    {% set line_length = (x2 - x1) | abs %}
    {% set purge_e = params.E | default(line_length * flow) | float %}

    # Preserve the caller's coordinate/extrusion modes.  MOVE=0 leaves the
    # nozzle where this macro puts it while restoring G90/G91, M82/M83, etc.
    SAVE_GCODE_STATE NAME=prime_line_state
    G90
    M83

    # Move to the start of the line, then draw it.
    G1 Z{z} F600
    G1 X{x1} Y{y} F{travel_f}
    G1 X{x2} E{purge_e} F{f}

    # Lift before handing control back to the slicer.  Do not retract here:
    # the line has already primed the nozzle and the next slicer extrusion
    # should start from that primed state.
    G1 Z{z + 1.0} F600

    RESTORE_GCODE_STATE NAME=prime_line_state MOVE=0
