[include Calibration.cfg]
[include Print_Start.cfg]
[include Print_Control.cfg]


#####################################################################
#   Machine Settings and Runtime State
#####################################################################

[gcode_macro _FFCP2]
description: Store machine settings and shared print-mode state
# Filament management temperatures (degrees Celsius)
variable_load_filament_extruder_default_temp: 230
variable_extruder_min_temp: 180

# Position offsets from the X endstops (mm)
# Filament loading: allow access to the filament levers and a safe purge area.
variable_filamentload_position_offset: 19
# Service: allow head removal during nozzle-height calibration.
variable_service_position_offset: 13

# X separation between the toolheads in COPY mode (mm)
variable_copy_offset_x: 115

# T0 nozzle offsets (mm): normally (0, 0, 0), unless needed for bed clearance.
variable_t0_nozzle_adjust_x: 0
variable_t0_nozzle_adjust_y: 0
variable_t0_nozzle_adjust_z: 0

# T1 nozzle offsets (mm): tune these values for your machine.
variable_t1_nozzle_adjust_x: 0.5
variable_t1_nozzle_adjust_y: -0.5
variable_t1_nozzle_adjust_z: 0

# COPY/MIRROR require physically matched nozzle heights and zero relative
# Z offset. Adjust the nozzle heights using M3x6 mm shim washers.

# Runtime state: selected mode and whether tool/mode changes are locked.
# Modes: IDLE, IDEX, T0, T1, MIRROR, COPY.
# Track intended print mode in addition to Klipper's carriage state.
variable_mode: "IDLE"
# Ignore slicer-inserted tool changes when the selected print mode is locked.
# OrcaSlicer inserts T0 at the beginning of most print jobs.
variable_mode_lock: False

# TODO: input shaping settings and pressure advance
gcode:
    # No commands; this macro stores settings and state.

#####################################################################
#   Tool Offset Macros
#####################################################################

[gcode_macro OFFSET_T0]
description: Apply T0 nozzle offsets. Usage: OFFSET_T0 [OP=revert]
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    {% if params.OP|lower == "revert" %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
        SET_GCODE_OFFSET X={ffcp2.t0_nozzle_adjust_x|float} Y={ffcp2.t0_nozzle_adjust_y|float} Z={ffcp2.t0_nozzle_adjust_z|float}
    {% endif %}


[gcode_macro OFFSET_T1]
description: Apply T1 nozzle offsets. Usage: OFFSET_T1 [OP=revert]
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    {% if params.OP|lower == "revert" %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
        SET_GCODE_OFFSET X={ffcp2.t1_nozzle_adjust_x|float} Y={ffcp2.t1_nozzle_adjust_y|float} Z={ffcp2.t1_nozzle_adjust_z|float}
    {% endif %}

