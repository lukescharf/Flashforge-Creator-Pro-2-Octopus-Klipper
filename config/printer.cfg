[include mainsail.cfg]
[include Macros.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_080029000D51313339373836-if00

[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 30
max_z_accel: 100
square_corner_velocity: 5

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 600

[exclude_object] 


##### Primary X Carriage / Left Print Head #####
[tmc2209 stepper_x] # Left X-Carriage
uart_pin: PC4
run_current: 0.55
hold_current: 0.30
stealthchop_threshold: 999999
interpolate: true

[stepper_x]
dir_pin: !PF12
enable_pin: !PF14
step_pin: PF13
microsteps: 16
rotation_distance: 34.544
endstop_pin: PG6
position_endstop: -37.0
position_min: -37
position_max: 205
homing_speed: 100


##### Secondary X Carriage / Right Print Head #####
[tmc2209 dual_carriage] # Right X-Carriage
uart_pin: PE4
run_current: 0.55
hold_current: 0.40
stealthchop_threshold: 999999
interpolate: true

[dual_carriage]
axis: x
dir_pin: PF0
enable_pin: !PF1
step_pin: PC13
microsteps: 16
rotation_distance: 34.544
endstop_pin: PG11
position_endstop: 242.0
position_min: 0
position_max: 242.0
homing_speed: 100


##### Y Carriage #####
[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.75
hold_current: 0.30
stealthchop_threshold: 999999
interpolate: true

[stepper_y]
dir_pin: !PG1
enable_pin: !PF15
step_pin: PG0
microsteps: 16
rotation_distance: 35.544
endstop_pin: !PG9
position_endstop: 0
position_max: 176
homing_speed: 100


##### Z Jackscrew ######
[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.55
hold_current: 0.30
stealthchop_threshold: 999999
interpolate: true

[stepper_z]
dir_pin: !PG3
enable_pin: !PG5
step_pin: PF11
microsteps: 16
rotation_distance: 8
endstop_pin: !PG10
position_min: -5
#position_endstop: -5
position_max: 170
homing_speed: 15


##### Left Extruder #####
[tmc2209 extruder]
# MOTOR3 socket
uart_pin: PC7
run_current: 0.8
hold_current: 0.5
stealthchop_threshold: 0

[extruder]
# MOTOR3 socket
step_pin: PG4
dir_pin:  PC1
enable_pin: !PA2          # enable is active-low

# HE0 heater output
heater_pin: PA0

# T0 thermistor input
sensor_type: Generic 3950
sensor_pin: PF4
pullup_resistor: 4700

min_temp: 0
max_temp: 275
max_power: 1.0

# Motion defaults (tune for your hardware)
microsteps: 16
rotation_distance: 32
max_extrude_only_distance: 500
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.0

[heater_fan extruder]
pin: PA8
heater: extruder
max_power: 1.0
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic extruder_part_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.500

[filament_switch_sensor extruder_filament]
extruder: extruder
switch_pin: ^PG12
pause_on_runout: true

[filament_motion_sensor extruder_motion]
extruder: extruder                     # ***IDEX mapping: this is T0***
switch_pin: ^PG13
detection_length: 6.0
event_delay: 3.0                       # optional; filters short pauses :contentReference[oaicite:2]{index=2}
pause_delay: 0.5
pause_on_runout: true


##### Right Extruder #####
[tmc2209 extruder1]
# MOTOR4 socket
uart_pin: PF2
run_current: 0.8
hold_current: 0.5
stealthchop_threshold: 0

[extruder1]
# MOTOR4 socket
step_pin: PF9
dir_pin:  !PF10
enable_pin: !PG2

# HE1 heater output
heater_pin: PA3

# T1 thermistor input
sensor_type: Generic 3950
sensor_pin: PF5
pullup_resistor: 4700      # typical; adjust if needed

min_temp: 0
max_temp: 275
max_power: 1.0

# Motion defaults (tune for your hardware)
microsteps: 16
rotation_distance: 32
max_extrude_only_distance: 500
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.0

[heater_fan extruder1]
pin: PD12
heater: extruder1
max_power: 1.0
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic extruder1_part_fan]
pin: PD13
max_power: 1.0
kick_start_time: 0.500

[filament_switch_sensor extruder1_filament]
extruder: extruder1
switch_pin: ^PG14
pause_on_runout: true

[filament_motion_sensor extruder1_motion]
extruder: extruder1
switch_pin: ^PG15
detection_length: 6.0
event_delay: 3.0
pause_delay: 0.5
pause_on_runout: true


##### MCU Temperature & Cooling fan #####
[temperature_fan mcu_fan]
pin: PD14
sensor_type: temperature_mcu
cycle_time: 0.001
min_temp: 0
max_temp: 70
target_temp: 50
min_speed: 0.2
kick_start_time: 0.5
off_below: 0.2
max_power: 1.0
shutdown_speed: 0
control: watermark


##### Heater Bed #####
[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3
min_temp: 0
max_temp: 130

[bed_screws]
screw1: 99, 80
screw1_name: Virtual Center
screw2: 99, 8
screw2_name: Center Front
screw3: 39, 143
screw3_name: Left Back
screw4: 139, 143
screw4_name: Right Back

