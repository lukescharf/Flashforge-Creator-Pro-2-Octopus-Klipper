[include mainsail.cfg]
[include Components.cfg]
[include Macros.cfg]


#####
# Tunables
####
[gcode_macro _FFCP2_CONFIG]
variable_load_filament_extruder_temp: 230
variable_active_parking_offset: 16
variable_wipe_on_activate: False

variable_t0_nozzle_adjust_x: 0 # T0 offsets should be (0,0,0) unless you need another value to prevent bed-collsisions
variable_t0_nozzle_adjust_y: 0
variable_t0_nozzle_adjust_z: 0

variable_t1_nozzle_adjust_x: 0 # T1 offsets should be tuned to your machine
variable_t1_nozzle_adjust_y: -0.5
variable_t1_nozzle_adjust_z: 0.18

# TODO: input shaping settings and pressure advance
gcode:
    ; No op, just save some state

[gcode_macro OFFSET_T0]
gcode:
    {% if params.OP|lower == 'revert' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
        SET_GCODE_OFFSET X={(printer["gcode_macro _FFCP2_CONFIG"].t0_nozzle_adjust_x|float)} Y={(printer["gcode_macro _FFCP2_CONFIG"].t0_nozzle_adjust_y|float)} Z={(printer["gcode_macro _FFCP2_CONFIG"].t0_nozzle_adjust_z|float)}
    {% endif %}

[gcode_macro OFFSET_T1]
gcode:
    {% if params.OP|lower == 'revert' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
        SET_GCODE_OFFSET X={(printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_x|float)} Y={(printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_y|float)} Z={(printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_z|float)}
    {% endif %}


