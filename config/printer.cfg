[include mainsail.cfg]
[include Components.cfg]
[include Macros.cfg]
#[include timelapse.cfg]


#####
# Tunables
####
[gcode_macro _FFCP2]
variable_load_filament_extruder_default_temp: 230
variable_extruder_min_temp: 180
variable_copy_offset_x: 115 # mm X offset
variable_filamentload_position_offset: 19  # How far away from the endstops should the heads be for filament loading?
					   # We need good access to the filament-levers on the side, and also a safe place to poop.
variable_service_position_offset: 13  # How far away from the endstops should the heads be for head-removal during the Z1 Z2 offset calibration?

variable_t0_nozzle_adjust_x: 0 # Unt: mm.  T0 offsets should be (0,0,0) unless you need another value to prevent bed-collsisions
variable_t0_nozzle_adjust_y: 0
variable_t0_nozzle_adjust_z: 0 # If using MIRROR or COPY mode, physically adjust nozzles until this is 0 relative to the T1 head using M3x6mm shim washers

variable_t1_nozzle_adjust_x: 0.5 # Unit: mm T1 offsets should be tuned to your machine
variable_t1_nozzle_adjust_y: -0.5 # Unit: mm
variable_t1_nozzle_adjust_z: 0 # If using MIRROR or COPY mode, physically adjust nozzles until this is 0 relative to the T0 head using M3x6mm shim washers

variable_mode: "IDLE"  # Which print mode is selected?  ["IDLE", "IDEX", "T0", "T1", "MIRROR", "COPY"].  This is additional state-tracking on top of what Klipper already does, but it exists to track my intent in my own macros.
variable_mode_lock: False  # Are we allowed to change print modes?  OrcaSlicer inserts T0 at the beginning of most print-jobs, and several modes don't allow tool changes, so we need a state-variable to tell us when to ignore tool changes.

# TODO: input shaping settings and pressure advance
gcode:
    ; No op, just save some state

[gcode_macro OFFSET_T0]
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% if params.OP|lower == 'revert' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
        SET_GCODE_OFFSET X={ffcp2.t0_nozzle_adjust_x|float} Y={ffcp2.t0_nozzle_adjust_y|float} Z={ffcp2.t0_nozzle_adjust_z|float}
    {% endif %}

[gcode_macro OFFSET_T1]
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% if params.OP|lower == 'revert' %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
        SET_GCODE_OFFSET X={ffcp2.t1_nozzle_adjust_x|float} Y={ffcp2.t1_nozzle_adjust_y|float} Z={ffcp2.t1_nozzle_adjust_z|float}
    {% endif %}

