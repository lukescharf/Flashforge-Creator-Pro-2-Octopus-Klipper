#####################################################################
#   Basic Motions
#####################################################################


[gcode_macro G28]
# Wrap G28.0, forwarding all arguments, then reposition the homed axes.
#
# Usage: G28 [X] [Y] [Z]
# Behavior: after Y homing, move Y to half its maximum; after Z homing, move
# Z to 5 mm. Restore parsing state after each added move, without returning.
# The active extruder is read before G28.0 executes to select the final carriage.
# State: leave carriage selection and physical position changed; heater and
# fan settings are unchanged. Safety: clear the bed before homing.
rename_existing: G28.0
description: Autohome. Usage: G28 [X] [Y] [Z]
gcode:
    G28.0 {rawparams}

    # When homing Y, move it to the middle for easier filament
    # loading/unloading
    {% if(params.X is undefined and params.Z is undefined) or params.Y is defined %}
        # We mostly want to save/restore the G90/G91 mode here.
        SAVE_GCODE_STATE NAME=g28_state
        G90
        G0 Y{printer.toolhead.axis_maximum.y / 2}
        RESTORE_GCODE_STATE NAME=g28_state MOVE=0
    {% endif %}

    # When homing Z, lower it afterwards to prevent crashes and scratches
    {% if(params.X is undefined and params.Y is undefined) or params.Z is defined %}
        SAVE_GCODE_STATE NAME=g28_state
        G90
        # Leave some vertical space, save a build-plate
        G0 Z5
        RESTORE_GCODE_STATE NAME=g28_state MOVE=0
    {% endif %}

    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}


[gcode_macro _CG28]
# Conditional G28, following the community _CG28 convention (Ellis' guide):
# https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/conditional_homing.html
#
# Usage: _CG28 (no parameters; internal helper)
# Behavior: if any XYZ axis is unhomed, run a full G28, not just the missing
# axes. If all XYZ axes are homed, generate no commands. Trust Klipper's homed
# state; this does not detect physical displacement or skipped steps.
# State: calling the project's G28 wrapper also applies its post-homing Y/Z
# positioning and carriage selection. Heater and fan settings are unchanged.
# Safety: do not invoke unhomed with a model on the bed. Use G28 explicitly
# when rehoming is required even though Klipper still reports the axes homed.
description: Conditional G28; home all axes only if any XYZ axis is unhomed
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


[gcode_macro PARK_ACTIVE]
# Park the primary carriage, or both carriages in COPY/MIRROR mode.
# Usage: PARK_ACTIVE (no parameters)
# Dependencies: PARK_T0 and PARK_T1; invalid carriage state raises an error.
# Safety: axes must already be homed and parking paths clear. Parsing and
# carriage state are restored by the helpers, but physical positions change.
description: Park active toolhead(s)
gcode:
    {% set c = printer.dual_carriage %}
    {% if c.carriage_1 in ["COPY", "MIRROR"] %}
        PARK_T0
        PARK_T1
    {% elif c.carriage_1 == "PRIMARY" %}
        PARK_T1
    {% elif c.carriage_0 == "PRIMARY" %}
        PARK_T0
    {% else %}
        {action_raise_error("PARK_ACTIVE: Invalid carriage state")}
    {% endif %}


[gcode_macro PARK_T0]
# Park T0 at stepper_x.position_min + 0.5 mm; do not home.
# Usage: PARK_T0 (no parameters)
# State: save and restore G-code and dual-carriage state with MOVE=0; leave
# the head parked. The configured X endstop is not necessarily this position.
# Safety: X must be homed; verify travel and clearance at max_velocity.
description: Park T0 near the configured minimum X position
gcode:
    SAVE_GCODE_STATE NAME=PARK_T0
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T0

    # Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=0

    # Perform the move
    G90
    G1 X{printer.configfile.settings["stepper_x"]["position_min"] | float + 0.5} F{printer.toolhead.max_velocity * 60.0}

    # Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T0 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T0 MOVE=0


[gcode_macro PARK_T1]
# Park T1 at dual_carriage.position_max - 0.5 mm; do not home.
# Usage: PARK_T1 (no parameters)
# State: save and restore G-code and dual-carriage state with MOVE=0; leave
# the head parked. The configured X endstop is not necessarily this position.
# Safety: X must be homed; verify travel and clearance at max_velocity.
description: Park T1 near the configured maximum X position
gcode:
    SAVE_GCODE_STATE NAME=PARK_T1
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T1

    # Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=1

    # Perform the move
    G90
    G1 X{printer.configfile.settings["dual_carriage"]["position_max"] | float - 0.5} F{printer.toolhead.max_velocity * 60.0}

    # Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T1 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T1 MOVE=0


[gcode_macro _CENTER_POSITION]
# Compatibility alias; forward all parameters to _POSITION_CENTER.
description: Alias for _POSITION_CENTER
gcode:
    _POSITION_CENTER {rawparams}


[gcode_macro _POSITION_CENTER]
# Bring both heads toward the center for manual calibration.
#
# Usage: _POSITION_CENTER (no parameters consumed)
# Behavior: request TMIRROR unless the tracked mode already says MIRROR, then
# move using stepper_x.position_max and dual_carriage.safe_distance.
# Preconditions: absolute positioning, homed axes, clear bed, unlocked mode.
# State: leave position, mirror mode, and associated tool/sensor changes in
# effect. No parsing state is saved. Tracked mode must match actual state.
description: Position both heads near the center for calibration
gcode:
    # FIXME: Do we want to do any state-management here?
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x = printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage = printer.configfile.settings["dual_carriage"] %}

    # Optional diagnostics: uncomment to report the positioning calculation.
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: stepper_x.position_max/2={stepper_x.position_max / 2}"
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: dual_carriage.safe_distance/2={dual_carriage.safe_distance / 2}"
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: X={stepper_x.position_max / 2 - dual_carriage.safe_distance / 2 - 0.5}"

    {% if ffcp2.mode | upper not in ["MIRROR"] %}
        TMIRROR
    {% endif %}

    G0 X{stepper_x.position_max / 2 - dual_carriage.safe_distance / 2 - 0.5} Y{printer.toolhead.axis_maximum.y / 2} F{printer.toolhead.max_velocity * 60.0}


[gcode_macro _SERVICE_POSITION]
# Compatibility alias; forward all parameters to _POSITION_SERVICE.
description: Alias for _POSITION_SERVICE
gcode:
    _POSITION_SERVICE {rawparams}


[gcode_macro _POSITION_SERVICE]
# Move heads apart to provide access for manual service.
#
# Usage: _POSITION_SERVICE (no parameters consumed)
# Behavior: request TMIRROR unless the tracked mode already says MIRROR, then
# use the X endstop plus _FFCP2.service_position_offset for the service move.
# Preconditions: absolute positioning, homed axes, clear bed, unlocked mode.
# State: leave position, mirror mode, and associated tool/sensor changes in
# effect. No parsing state is saved. Tracked mode must match actual state.
description: Position both heads for manual service
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x = printer.configfile.settings["stepper_x"] %}

    {% if ffcp2.mode | upper not in ["MIRROR"] %}
        TMIRROR
    {% endif %}

    G0 X{stepper_x.position_endstop + printer["gcode_macro _FFCP2"].service_position_offset} Y{printer.toolhead.axis_maximum.y / 2} F{printer.toolhead.max_velocity * 60.0}


[gcode_macro _FILAMENTLOAD_POSITION]
# Compatibility alias; forward all parameters to _POSITION_FILAMENTLOAD.
description: Alias for _POSITION_FILAMENTLOAD
gcode:
    _POSITION_FILAMENTLOAD {rawparams}


[gcode_macro _POSITION_FILAMENTLOAD]
# Move the active head to an accessible filament-loading position.
#
# Usage: _POSITION_FILAMENTLOAD (no parameters)
# Behavior: home if needed, then choose X from the active extruder snapshot
# and the configured endstop/filamentload_position_offset; center Y.
# Preconditions: use absolute positioning and provide clearance. Do not invoke
# unhomed with a model on the bed. No parsing state is saved or restored.
# Limitations: COPY/MIRROR follow existing synchronization; COPY handling is
# unfinished. This macro neither heats nor extrudes.
description: Position the active head for filament loading or pause
gcode:
    {% set stepper_x = printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage = printer.configfile.settings["dual_carriage"] %}
    {% set active_extruder = printer.toolhead.extruder %}

    _CG28

    {% if active_extruder == "extruder1" %}
        # For IDEX with T1 selected or the T1 single-tool mode, we only need to
        # park the active head.
        G0 X{dual_carriage.position_endstop - printer["gcode_macro _FFCP2"].filamentload_position_offset} Y{printer.toolhead.axis_maximum.y / 2} F{printer.toolhead.max_velocity * 60.0}
    {% else %}
        # For IDEX with T0 selected, T0 single-tool-mode, mirror mode, and copy
        # mode
        # FIXME: Do something smart for copy mode. Can we break the copy
        # setting and resume it at the end?  Maybe some of this logic needs to
        # be in the PAUSE macro?
        G0 X{stepper_x.position_endstop + printer["gcode_macro _FFCP2"].filamentload_position_offset} Y{printer.toolhead.axis_maximum.y / 2} F{printer.toolhead.max_velocity * 60.0}
    {% endif %}


[gcode_macro PRESENT_PRINT]
# Park both heads and lower the bed to the configured maximum Z position.
#
# Usage: PRESENT_PRINT (no parameters; public console/OctoApp action)
# Preconditions: all axes homed, absolute positioning, and clear travel.
# Behavior: deliberately do not home; park T0/T1 and move Z with the current
# homing-origin adjustment. State: leave physical position and feed rate changed;
# parking helpers restore their parsing/carriage state. Heaters and tracked
# print mode are unchanged; use END_PRINT for shutdown and mode reset.
description: Park both heads and lower the bed for model removal; requires homed axes and G90
gcode:
    # Don't home the axes; FIXME: add a HOME=true/false parameter to
    # PRESENT_PRINT
    PARK_T0
    PARK_T1
    G0 Z{printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z} F{printer.toolhead.max_velocity * 60.0}
