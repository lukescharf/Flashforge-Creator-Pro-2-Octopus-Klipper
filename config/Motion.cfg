#####
# Basic Motions
######

[gcode_macro G28]
rename_existing: G28.0
description: Autohome. Usage: G28 [X] [Y] [Z]
gcode:
    G28.0 {rawparams}

    ; When homing Y, move it to the middle for easier filament loading/unloading
    {% if (params.X is undefined and params.Z is undefined) or params.Y is defined  %}
        SAVE_GCODE_STATE NAME=g28_state  # We mostly want to save/restore the G90/G91 mode here.
        G90
        G0 Y{printer.toolhead.axis_maximum.y/2}
        RESTORE_GCODE_STATE NAME=g28_state
    {% endif %}

    ; When homing Z, lower it afterwards to prevent crashes and scratches
    {% if (params.X is undefined and params.Y is undefined) or params.Z is defined  %}
        SAVE_GCODE_STATE NAME=g28_state
        G90
        G0 Z5  # Leave some vertical space, save a build-plate
        RESTORE_GCODE_STATE NAME=g28_state
    {% endif %}

    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}

[gcode_macro _MOTORS_ACTIVE_BARRIER]
description: Autohome, but only if necessary. Usage: MOTORS_ACTIVE_BARRIER
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


[gcode_macro PARK_ACTIVE]
description: Park active toolhead(s)
gcode:
    {% set c = printer.dual_carriage %}
    {% if c.carriage_1 in ["COPY", "MIRROR"] %}
        PARK_T0
        PARK_T1
    {% elif c.carriage_1 == "PRIMARY" %}
        PARK_T1
    {% elif c.carriage_0 == "PRIMARY" %}
        PARK_T0
    {% else %}
        {action_raise_error("PARK_ACTIVE: Invalid carriage state")}
    {% endif %}

 
; Park T0 / Primary / Left Extruder
; Park at left endstop
[gcode_macro PARK_T0]
description: Park T0 / Primary / Left Extruder at the left endstop.
gcode:
    SAVE_GCODE_STATE NAME=PARK_T0
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T0 

    ; Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=0

    ; Perform the move
    G90
    G1 X{printer.configfile.settings["stepper_x"]["position_min"]|float+0.5} F{printer.toolhead.max_velocity*60.0}

    ; Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T0 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T0 MOVE=0


; Park T1 / Secondary / Right Extruder
; Park at right endstop
[gcode_macro PARK_T1]
description: Park T1 / Secondary / Right Extruder at the right endstop.
gcode:
    SAVE_GCODE_STATE NAME=PARK_T1
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T1 

    ; Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=1

    ; Perform the move
    G90
    G1 X{printer.configfile.settings["dual_carriage"]["position_max"]|float-0.5} F{printer.toolhead.max_velocity*60.0}

    ; Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T1 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T1 MOVE=0


[gcode_macro _CENTER_POSITION]
gcode:
    _POSITION_CENTER {rawparams}

[gcode_macro _POSITION_CENTER]
description: Put both heads together in the center position for Z_ENDSTOP_CALIBRATE and manual calibration steps
gcode:
    # FIXME: Do we want to do any state-management here?
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage= printer.configfile.settings["dual_carriage"] %}

    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: stepper_x.position_max/2={stepper_x.position_max/2}"
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: dual_carriage.safe_distance/2={dual_carriage.safe_distance/2}"
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: X={stepper_x.position_max/2-dual_carriage.safe_distance/2-0.5}"

    {% if ffcp2.mode|upper not in ["MIRROR"] %}
       TMIRROR
    {% endif %}

    G0 X{stepper_x.position_max/2-dual_carriage.safe_distance/2-0.5} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}


[gcode_macro _SERVICE_POSITION]
gcode:
    _POSITION_SERVICE {rawparams}

[gcode_macro _POSITION_SERVICE]
description: Put both heads into the the service position for Z_ENDSTOP_CALIBRATE and manual calibration steps.
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}

    {% if ffcp2.mode|upper not in ["MIRROR"] %}
       TMIRROR
    {% endif %}

    G0 X{stepper_x.position_endstop+printer["gcode_macro _FFCP2"].service_position_offset} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}


# Move the active extruder to the Filament the Filament the Filament the Filament the Filament the Filament the Filament the Filament the Filament Loading Position
[gcode_macro _FILAMENTLOAD_POSITION]
gcode:
    _POSITION_FILAMENTLOAD {rawparams}

[gcode_macro _POSITION_FILAMENTLOAD]
description: Park the active toolhead for LOAD_FILAMENT, UNLOAD_FILAMENT and PAUSE.  This location is a safe place to poop.
gcode:
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage= printer.configfile.settings["dual_carriage"] %}
    {% set active_extruder = printer.toolhead.extruder %}

    _MOTORS_ACTIVE_BARRIER

    {% if active_extruder == "extruder1" %}
        # For IDEX with T1 selected or the T1 single-tool mode, we only need to park the active head.
        G0 X{dual_carriage.position_endstop-printer["gcode_macro _FFCP2"].filamentload_position_offset} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}
    {% else %}
        # For IDEX with T0 selected, T0 single-tool-mode, mirror mode, and copy mode
        # FIXE: Do something smart for copy mode.  Can we break the copy setting and resume it at the end?  Maybe some of this logic needs to be in the PAUSE magro?
        G0 X{stepper_x.position_endstop+printer["gcode_macro _FFCP2"].filamentload_position_offset} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}
    {% endif %}


[gcode_macro _POSITION_JOBDONE]
description: Park the axes so that the operator can unload the machine
gcode:
    # Don't home the axes; FIXME: add a HOME=true/false parameter to _POSITION_JOBDONE
    PARK_T0
    PARK_T1
    G0 Z{printer.toolhead.axis_maximum.z-printer.gcode_move.homing_origin.z } F{printer.toolhead.max_velocity * 60.0}
