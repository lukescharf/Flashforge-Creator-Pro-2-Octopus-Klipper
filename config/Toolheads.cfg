#####################################################################
#   Tool Changes
#####################################################################


[gcode_macro T0]
# Select the left nozzle for independent motion when mode changes are unlocked.
#
# Usage: T0 (no parameters)
# Behavior: home if needed, even when mode_lock prevents the tool change.
# State: park T1, disconnect extrusion synchronization, select T0, update fans
# and filament sensors, apply T0 offsets, and store mode="t0" as written below.
# Restore G-code parsing state without returning to the previous position.
# Safety: homing and parking require a clear motion path; do not home over a
# model. Heater targets are unchanged. Requires Motion.cfg and Fans.cfg.
description: Select T0 (left extruder) when mode changes are unlocked
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

        # Are mode changes unlocked?
    {% if ffcp2.mode_lock == false %}
        # Manage state
        SAVE_GCODE_STATE NAME=t0_state

        # Deactivate old toolhead(s)
        # disconnect mirror/copy relationship
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        # disconnect mirror/copy relationship
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=0
        PARK_T1

        # Activate new toolhead
        # disconnect mirror/copy relationship
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=primary
        _APPLY_PART_FAN_ACTIVE
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1

        # Manage state
        RESTORE_GCODE_STATE NAME=t0_state MOVE=0
        OFFSET_T0
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"t0"'
    {% endif %}


[gcode_macro T1]
# Select the right nozzle for independent motion when changes are unlocked.
#
# Usage: T1 (no parameters)
# Behavior: home if needed, even when mode_lock prevents the tool change.
# State: park T0, disconnect extrusion synchronization, select T1, update fans
# and filament sensors, apply T1 offsets, and store mode="T1".
# Restore G-code parsing state without returning to the previous position.
# Safety: homing and parking require a clear motion path; do not home over a
# model. Heater targets are unchanged. Requires Motion.cfg and Fans.cfg.
description: Select T1 (right extruder) when mode changes are unlocked
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    # Are we allowed to change tools?
    {% if ffcp2.mode_lock == false %}
        # Manage State
        SAVE_GCODE_STATE NAME=t1_state

        # Deactivate old toolhead(s)
        # Disconnect mirror/copy relationship
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
        # Disconnect mirror/copy relationship
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=0
        PARK_T0

        # Activate new toolhead
        # Disconnect mirror/copy relationship
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        _APPLY_PART_FAN_ACTIVE
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

        # Manage State
        RESTORE_GCODE_STATE NAME=t1_state MOVE=0
        OFFSET_T1
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"T1"'
    {% endif %}


[gcode_macro TMIRROR]
# Select synchronized mirror motion when mode changes are unlocked.
#
# Usage: TMIRROR (no parameters)
# Behavior: home if needed, then park both heads before enabling mirror mode.
# The homing barrier runs even if mode_lock prevents the mode change.
# State: T0 stays active; T1 extrusion follows T0; both filament sensors are
# enabled. Restore parsing state without a return move; store mode="MIRROR".
# Heater targets and fan speeds are not set here. No prior mode is restored.
# Safety: verify head separation and matched nozzle heights; allow homing only
# with a clear bed. Requires Motion.cfg and both extruder definitions.
description: Select both T0 and T1 in mirror mode
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    # Are we allowed to change tools?
    {% if ffcp2.mode_lock == false %}
        # Manage State
        SAVE_GCODE_STATE NAME=tboth_mirror_state

        # Park both heads without rehoming.
        PARK_T0
        PARK_T1

        # Sync motions T0 -> T1
        # Since both extruders are parked, the positioning steps
        # used in copy mode are not necessary here.
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
        # Set T1 motion to follow T0
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=mirror
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        # Set T0 move independently
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        # Set T1 to follow T0
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

        # Monitor both filament sensors
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

        # Manage state
        RESTORE_GCODE_STATE NAME=tboth_mirror_state MOVE=0
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"MIRROR"'
    {% endif %}


[gcode_macro TCOPY]
# Select synchronized copy motion using the configured X separation.
#
# Usage: TCOPY (no parameters)
# Behavior: home if needed; when unlocked, select T0 and position T1 at
# _FFCP2.copy_offset_x before enabling copy mode. The homing barrier runs
# even when mode_lock prevents the mode change.
# State: T0 stays active; T1 extrusion follows T0; both filament sensors are
# enabled. Restore parsing state without a return move; store mode="COPY".
# The nested T0 call applies its fan and offset changes. Heaters are unchanged.
# Safety: verify separation, matched nozzle heights, and clear travel. Do not
# allow automatic homing with a model on the bed. Requires Motion.cfg and T0.
description: Select both T0 and T1 in copy mode
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    # Are we allowed to change tools?
    {% if ffcp2.mode_lock == false %}
        # Manage State
        SAVE_GCODE_STATE NAME=tboth_copy_state

        # Position T0
        T0
        # Position T0 at the origin
        G0 X0 F{printer.toolhead.max_velocity * 60.0}

        # Position T1 relative to T0 for copy mode
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        # Position T1 relative to T0
        G1 X{0 + ffcp2.copy_offset_x} F{printer.toolhead.max_velocity * 60.0}

        # Sync motions T0 -> T1
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
        # Set T1 motion to follow T0
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=copy
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        # Set T0 move independently
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        # Set T1 to follow T0
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

        # Monitor both filament sensors
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

        # Manage state
        RESTORE_GCODE_STATE NAME=tboth_copy_state MOVE=0
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"COPY"'
    {% endif %}
