##### Printer-Wide Configuration Items #####
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_080029000D51313339373836-if00

[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 30
max_z_accel: 100
square_corner_velocity: 5

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 1800

[firmware_retraction]
retract_length: 1.2
retract_speed: 35
unretract_extra_length: 0.0
unretract_speed: 35

[exclude_object] 


##### Primary X Carriage / Left Print Head #####
[tmc2209 stepper_x] # Left X-Carriage
uart_pin: PC4
run_current: 0.55
hold_current: 0.30
stealthchop_threshold: 999999
interpolate: true

[stepper_x]
dir_pin: !PF12
enable_pin: !PF14
step_pin: PF13
microsteps: 16
rotation_distance: 34.0
endstop_pin: PG6
position_min: -43.0
position_endstop: -38.0
position_max: 200
homing_speed: 50
homing_retract_dist: 7


##### Secondary X Carriage / Right Print Head #####
[tmc2209 dual_carriage] # Right X-Carriage
uart_pin: PE4
run_current: 0.55
hold_current: 0.40
stealthchop_threshold: 999999
interpolate: true

[dual_carriage]
axis: x
dir_pin: PF0
enable_pin: !PF1
step_pin: PC13
microsteps: 16
rotation_distance: 34.0
endstop_pin: PG11
position_min: 0.0
position_endstop: 237.0
position_max: 242.0
safe_distance: 40
homing_speed: 50
homing_retract_dist: 7


##### Y Carriage #####
[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.75
hold_current: 0.30
stealthchop_threshold: 999999
interpolate: true

[stepper_y]
dir_pin: !PG1
enable_pin: !PF15
step_pin: PG0
microsteps: 16
rotation_distance: 34.0
endstop_pin: !PG9
position_min: -13
position_endstop: -10
position_max: 150
homing_speed: 50


##### Z Jackscrew ######
[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.55
hold_current: 0.30
stealthchop_threshold: 999999
interpolate: true

[stepper_z]
dir_pin: !PG3
enable_pin: !PG5
step_pin: PF11
microsteps: 16
rotation_distance: 8.0
endstop_pin: !PG10
position_min: -5
#position_endstop: -5 # Vestigial entry;  Z_ENDSTOP_CALIBRATE procedure takes care of this.
position_max: 170
homing_speed: 15


##### Left Extruder #####
[tmc2209 extruder]
# MOTOR3 socket
uart_pin: PC7
run_current: 0.8
hold_current: 0.5
stealthchop_threshold: 0

[extruder]
# MOTOR3 socket
step_pin: PG4
dir_pin:  PC1
enable_pin: !PA2          # enable is active-low

# HE0 heater output
heater_pin: PA0

# T0 thermistor input
sensor_type: Generic 3950
sensor_pin: PF4
pullup_resistor: 4700

min_temp: 0
max_temp: 275

microsteps: 16
rotation_distance: 33
max_extrude_only_distance: 500
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.0

[heater_fan extruder]
pin: PA8
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic extruder_part_fan]
pin: PE5
max_power: 1.00  # Nerf the part-cooling fan-power to prevent hotend-related thermal shutdowns on dense layers.  Tuned so that 50% part-fan in the slicer is about right for PLA.
kick_start_time: 0.500

[filament_switch_sensor extruder_filament]
switch_pin: ^PG12
runout_gcode:
  #PAUSE
  M117 T0 Filament switch runout
insert_gcode:
  M117 T0 Filament switch inserted


[filament_motion_sensor extruder_motion]
extruder: extruder
switch_pin: ^PG13
detection_length: 6.0
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE
  M117 T0 Filament encoder runout
insert_gcode:
  M117 T0 Filament encoder motion successfully detected


##### Right Extruder #####
[tmc2209 extruder1]
# MOTOR4 socket
uart_pin: PF2
run_current: 0.8
hold_current: 0.5
stealthchop_threshold: 0

[extruder1]
# MOTOR4 socket
step_pin: PF9
dir_pin:  !PF10
enable_pin: !PG2

# HE1 heater output
heater_pin: PA3

# T1 thermistor input
sensor_type: Generic 3950
sensor_pin: PF5
pullup_resistor: 4700      # typical; adjust if needed

min_temp: 0
max_temp: 275

microsteps: 16
rotation_distance: 33
max_extrude_only_distance: 500
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.0

[heater_fan extruder1]
pin: PD12
heater: extruder1
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic extruder1_part_fan]
pin: PD13
max_power: 1.00  # Nerf the part-cooling fan-power to prevent hotend-related thermal shutdowns on dense layers.  Tuned so that 50% part-fan in the slicer is about right for PLA.
kick_start_time: 0.500

[filament_switch_sensor extruder1_filament]
switch_pin: ^PG14
pause_on_runout: False
runout_gcode:
  #PAUSE
  M117 T1 Filament switch runout
insert_gcode:
  M117 T1 Filament switch inserted

[filament_motion_sensor extruder1_motion]
extruder: extruder1
switch_pin: ^PG15
detection_length: 6.0
pause_on_runout: False
runout_gcode:
  PAUSE
  M117 T1 Filament encoder runout
insert_gcode:
  M117 T0 Filament encoder motion successfully detected


##### MCU Temperature & Cooling fan #####
[temperature_fan mcu_fan]
pin: PD14
sensor_type: temperature_mcu
cycle_time: 0.001
min_temp: 0
max_temp: 70
target_temp: 45
min_speed: 0.2
kick_start_time: 0.5
off_below: 0.2
shutdown_speed: 0
control: watermark


##### Heater Bed #####
[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3
min_temp: 0
max_temp: 130

[bed_screws]
screw1: 99, 80
screw1_name: Virtual Center
screw2: 99, 8
screw2_name: Center Front
screw3: 39, 143
screw3_name: Left Back
screw4: 139, 143
screw4_name: Right Back


##### Enclosure Lights #####
[neopixel chamber_led]
pin: PB10
chain_count: 16
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0


##### Chamber #####
[heater_generic chamber_heater]
heater_pin: PB0
sensor_type: Generic 3950
sensor_pin: PF6
min_temp: 0
max_temp: 65
control: pid
pwm_cycle_time: 0.2 # Set for SSR

[verify_heater chamber_heater]
check_gain_time: 1800	# Your chamber is hot in 30 minutes or less
max_error: 32768	# (1800 seconds * (55°C-20°C))/2, to the nearest round number
hysteresis: 5		# Don't sweat 5 degrees


