#####################################################################
#   Heating and Cooling
#####################################################################


[gcode_macro _NOZZLE_HOT_ACTIVE_BARRIER]
# Ensure the active nozzle reaches its existing target or the loading default.
#
# Usage: _NOZZLE_HOT_ACTIVE_BARRIER (no parameters)
# Behavior: read the active extruder target as int. Keep it if strictly above
# _FFCP2.extruder_min_temp; otherwise use load_filament_extruder_default_temp.
# Set M104 and block with M109; temperature waits have no timeout here.
# State: leave the active nozzle target changed; no motion or mode changes.
# Limitation: COPY/MIRROR select T0, so this does not ensure T1 is hot even
# though T1 extrusion may follow T0. Requires both heater and macro settings.
description: Heat and wait for the active nozzle before filament operations
gcode:
    # FIXME: support for COPY and MIRROR modes.
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set active_extruder = printer[printer.toolhead.extruder] %}

    # How hot should the active nozzle be?
    {% if active_extruder.target | int > ffcp2.extruder_min_temp %}
        # If the operator or gcode selected a sane temperature, go with it
        {% set target_temp = active_extruder.target | int %}
    {% else %}
        # The operator did not select a temperature, so let's go with the
        # machine's default
        {% set target_temp = ffcp2.load_filament_extruder_default_temp | int %}
    {% endif %}

    # Ensure the nozzle is hot
    RESPOND TYPE=echo MSG="Waiting for active nozzle at {target_temp}°C."
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for nozzle {target_temp}C
    {% endif %}
    M104 S{target_temp}
    M109 S{target_temp}
    RESPOND TYPE=echo MSG="Active nozzle ready. Continuing."
    {% if not printer.pause_resume.is_paused %}
        M117 Nozzle ready
    {% endif %}


[gcode_macro M140]
# Override stock M140 with a conditionally blocking bed-temperature command.
#
# Usage: M140 S100; S is the target in C, default 0.
# Behavior: always home if needed, then forward all arguments to M140.0.
# Wait within +/-3 C when heating outside tolerance. For cooling, wait only
# when the target exceeds the greater of chamber target/actual temperature
# by more than 5 C. Decisions use render-time temperature snapshots.
# State: when waiting, park and restore G-code/dual-carriage state with return
# moves. Bed target remains set; other heater targets are unchanged.
# Safety: even S0 can home; do not invoke unhomed with a model on the bed.
# Requires Motion.cfg and chamber_heater. No timeout on temperature waits.
rename_existing: M140.0
description: Set bed target; wait for heating and conditionally for cooling
gcode:
    # Setpoint: °C target
    {% set target = params.S | default(0) | float %}
    # Sensor: °C measured
    {% set actual = printer.heater_bed.temperature | float %}
    {% set chamber_floor = [printer["heater_generic chamber_heater"].target | float, printer["heater_generic chamber_heater"].temperature | float] | max %}
    # Tunable: temperature tolerance
    {% set tolerance = 3.0 %}

    _CG28

    # Inherit from the original M140 maco
    M140.0 {rawparams}

    # Block until the target temperature is reached
    {% if target > 0 and(actual - target) | abs > tolerance and(target > actual or target > chamber_floor + 5) %}
        RESPOND TYPE=echo MSG="Bed temperature {actual | round(1)}°C, target {target | round(1)}°C. Parking toolhead until temperature is nominal."
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for bed {target | round(1)}C
        {% endif %}

        SAVE_GCODE_STATE NAME=m140_state
        SAVE_DUAL_CARRIAGE_STATE NAME=m140_dc_state

        PARK_ACTIVE

        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target - tolerance} MAXIMUM={target + tolerance}

        RESTORE_DUAL_CARRIAGE_STATE NAME=m140_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=m140_state MOVE=1

        RESPOND TYPE=echo MSG="Bed temperature within {tolerance | round(1)}°C of {target | round(1)}°C. Continuing."
        {% if not printer.pause_resume.is_paused %}
            M117 Bed ready
        {% endif %}
    {% endif %}


[gcode_macro M141]
# Set chamber temperature and conditionally wait within +/-3 C.
#
# Usage: M141 S55; S is the target in C, default 0.
# Behavior: set chamber target first. Wait for heating outside tolerance; for
# cooling, wait only for targets >= 30 C and <= measured bed temperature + 10 C.
# Decisions use render-time snapshots. S0 switches off without homing/waiting.
# State: when waiting, home if needed, park, then restore G-code and carriage
# state with return moves. Leave the chamber target set; no bed-target changes.
# Safety: do not invoke a waiting path unhomed with a model on the bed.
# Requires Motion.cfg and chamber_heater; waits have no timeout.
description: Set chamber target; wait for heating and conditionally for cooling
gcode:
    # Setpoint: °C target
    {% set target = params.S | default(0) | float %}
    # Sensor: °C measured
    {% set actual = printer["heater_generic chamber_heater"].temperature | float %}
    {% set bed_temp = printer.heater_bed.temperature | float %}
    # Tunable: temperature tolerance
    {% set tolerance = 3.0 %}

    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}

    # Always wait for heating outside tolerance.
    # For cooling, skip waiting below 30°C or above measured bed temperature +
    # 10°C.
    # Evaluate temperatures once, when this macro is invoked.
    {% if target > 0 and(actual - target) | abs > tolerance and(target > actual or(target >= 30 and target <= bed_temp + 10)) %}
        _CG28
        RESPOND TYPE=echo MSG="Chamber temperature {actual | round(1)}°C, target {target | round(1)}°C. Parking toolhead until temperature is nominal."
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for chamber {target | round(1)}C
        {% endif %}

        SAVE_GCODE_STATE NAME=m141_state
        SAVE_DUAL_CARRIAGE_STATE NAME=m141_dc_state

        PARK_ACTIVE

        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target - tolerance} MAXIMUM={target + tolerance}

        RESTORE_DUAL_CARRIAGE_STATE NAME=m141_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=m141_state MOVE=1

        RESPOND TYPE=echo MSG="Chamber temperature within {tolerance | round(1)}°C of {target | round(1)}°C. Continuing."
        {% if not printer.pause_resume.is_paused %}
            M117 Chamber ready
        {% endif %}
    {% elif target == 0 %}
        RESPOND TYPE=echo MSG="Chamber heater off"
    {% else %}
        RESPOND TYPE=echo MSG="Chamber target set to {target | round(1)}°C without waiting."
    {% endif %}


[gcode_macro M191]
# Set the chamber temperature and wait until it is within ±7% of the target.
#
# Usage: M191 S55
#
# Parameters:
#   S: Chamber target in °C. Default: 0.
#      Zero or negative values turn off the chamber heater without waiting.
#
# Behavior:
#   For positive S, leave the chamber heater set to S after the wait.
#   If the bed target is below 1°C, save it and use the bed to assist heating
#   at the greater of S or 65°C. Cooling is passive, not a controlled ramp.
#   After waiting, always apply the stored bed_temp_target to the bed, even
#   if the bed was already in use. This value is read when the macro renders,
#   before any SET_GCODE_VARIABLE command in this invocation executes.
#   May home all axes if any axis is unhomed. Skip homing if all are homed.
#
# Safety:
#   Do not invoke with unhomed axes and a model on the bed.
#   The wait has no timeout; an unreachable target can block indefinitely.
variable_bed_temp_target: 0.0
description: Set chamber target and wait within ±7%. Usage: M191 S<temperature>
gcode:
    # Chamber target in °C.
    {% set s = params.S | default(0) | float %}
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    {% if s > 0 %}
        RESPOND TYPE=echo MSG="Waiting for chamber temperature within 7% of {s | round(1)}°C."
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for chamber {s | round(1)}C
        {% endif %}

        # Use the bed to assist chamber heating only when its target is below
        # 1°C.
        {% if printer.heater_bed.target | float < 1.0 %}
            SET_GCODE_VARIABLE MACRO=M191 VARIABLE=bed_temp_target VALUE={printer.heater_bed.target | float}
            # The assisting bed target is at least 65°C.
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={[s, 65] | max}
        {% endif %}

        # Set the chamber target for heating or passive cooling.
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s}

        # Ensure axes are homed when needed or when the selected mode is IDLE.
        # The barrier leaves the machine in place if all axes are already
        # homed.
        {% if "xyz" not in printer.toolhead.homed_axes or ffcp2.mode == "IDLE" %}
            _CG28
        {% endif %}

        # Wait for the measured chamber temperature to be within ±7% of S.
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={s * 0.93} MAXIMUM={s * 1.07}

        # Apply the stored bed target from this invocation's template snapshot.
        # SET_GCODE_VARIABLE above does not update that snapshot.
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp_target}

        RESPOND TYPE=echo MSG="Chamber temperature within 7% of {s | round(1)}°C. Continuing."
        {% if not printer.pause_resume.is_paused %}
            M117 Chamber ready
        {% endif %}

    {% else %}
        # Turn off only the chamber heater, without waiting or homing.
        RESPOND TYPE=echo MSG="Chamber heater off"
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}


[gcode_macro CONTROLLED_COOLDOWN]
# Gradually lower bed and chamber temperature targets before ending a job.
# The chamber target follows the bed target once the bed target drops below
# the chamber's starting temperature. Actual cooling speed may vary.
#
# Parameters:
#   S: Required final cooling target in °C; must be positive and
#      reachable by passive cooling in the operating environment.
#   R: Target reduction rate in °C/min; must be positive. Default: 5.
#   MOVE: Allow initial parking and final positioning when positive. Default: 1.
#
# Behavior:
#   Park before cooling and position for unloading only when MOVE is enabled.
#   With MOVE=0, perform thermal operations only; do not move or home any axes.
#   Turn off nozzle heaters when performing a cooling ramp.
#   Turn off bed and chamber heaters afterward; S is not a holding temperature.
#
# Preconditions:
#   When MOVE is enabled, axes must already be homed.
#   Do not home with a model on the bed.
#
# Usage: CONTROLLED_COOLDOWN S=45 R=1.3 MOVE=1
# State: leave position changed if moving; do not restore heater targets or
# overall parsing state. The ramp is generated from one temperature snapshot,
# not a live polling loop. Nozzle heaters are untouched when no ramp is needed.
# Limitations: final waits use S + 3 C for both sensors with no timeout. Choose
# a reachable target; very small positive R values generate large command lists.
# Invalid S/R raises an error during template rendering, before commands run.
description: Steadily cool the bed and chamber. S=<target °C> R=<°C/min> [MOVE=0|1]
gcode:
    {% if params.S is undefined %}
        {action_raise_error("CONTROLLED_COOLDOWN: S is required; choose a reachable final temperature, for example S=45.")}
    {% endif %}

    # Final bed target in °C.
    {% set bed_temp_finish = params.S | float %}
    {% if bed_temp_finish <= 0 %}
        {action_raise_error("CONTROLLED_COOLDOWN: S must be positive and reachable by passive cooling.")}
    {% endif %}
    # Cooling rate in °C/min.
    {% set cooling_per_minute = params.R | default(5) | float %}
    {% if cooling_per_minute <= 0 %}
        {action_raise_error("CONTROLLED_COOLDOWN: R must be greater than zero (degrees C/min).")}
    {% endif %}
    # Allow initial parking and final positioning when positive.
    {% set allowed_to_move = params.MOVE | default(1) | int %}

    # Use heater targets when enabled, or measured temperatures when off.
    {% if printer.heater_bed.target | float > 0 %}
        {% set bed_temp_start = printer.heater_bed.target | float %}
    {% else %}
        {% set bed_temp_start = printer.heater_bed.temperature | float %}
    {% endif %}

    {% if printer["heater_generic chamber_heater"].target | float > 0 %}
        {% set chamber_temp_start = printer["heater_generic chamber_heater"].target | float %}
    {% else %}
        {% set chamber_temp_start = printer["heater_generic chamber_heater"].temperature | float %}
    {% endif %}

    # Calculate the nominal ramp duration in seconds.
    {% set cooling_per_second = cooling_per_minute / 60 %}
    {% set seconds = ((bed_temp_start - bed_temp_finish) / cooling_per_second) | int %}

    # Park the printhead so it doesn't cook the model.
    {% if allowed_to_move > 0 %}
        PARK_ACTIVE
    {% endif %}

    # Ramp only when the starting bed temperature is above the final target.
    {% if bed_temp_start > bed_temp_finish %}
        RESPOND TYPE=echo MSG="Controlled cooldown: bed target {bed_temp_start | round(1)} to {bed_temp_finish | round(1)}°C at {cooling_per_minute | round(2)}°C/min; nominal ramp duration {seconds}s."
        {% if not printer.pause_resume.is_paused %}
            M117 Controlled cooldown
        {% endif %}

        # Turn off the printhead heaters.
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0

        # Cool the bed primarily, with the chamber following its target.
        {% for i in range(seconds) %}
            # Update the display each ramp step and log every 30 steps.
            {% set mm = ((seconds - i) / 60) | int %}
            {% set ss = ((seconds - i) % 60) | int %}
            {% if not printer.pause_resume.is_paused %}
                M117 Cooldown {(bed_temp_start - i * cooling_per_second) | round(1)}°C est {"%d:%02d" | format(mm, ss)}
            {% endif %}
            {% if i > 0 and(i % 30) == 0 %}
                RESPOND TYPE=echo MSG="Cooldown bed target {(bed_temp_start - i * cooling_per_second) | round(1)}°C; estimated ramp time remaining {"%d:%02d" | format(mm, ss)}."
            {% endif %}

            # Lower the bed target by one ramp step.
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={(bed_temp_start - i * cooling_per_second)}

            # Lower the chamber target once the bed target falls below
            # the chamber's starting temperature.
            {% if(bed_temp_start - i * cooling_per_second) < chamber_temp_start %}
                SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={(bed_temp_start - i * cooling_per_second)}
            {% else %}
                SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chamber_temp_start}
            {% endif %}

            # Dwell for one second between ramp steps.
            G4 P1000
        {% endfor %}

    {% else %}
        RESPOND TYPE=echo MSG="CONTROLLED_COOLDOWN bed already below target temperature."
    {% endif %}

    # Turn off the bed and chamber heaters after the ramp.
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0

    # Programmed cooldown done; turn off the heaters and wait for the bed and
    # chamber to reach the final target.
    M117 Cooldown waiting for {bed_temp_finish | round(1)}°C
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={bed_temp_finish + 3.0}
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MAXIMUM={bed_temp_finish + 3.0}
    M117 Controlled cooldown finished
    RESPOND TYPE=echo MSG="Controlled cooldown finished; bed and chamber heaters off."

    # Optionally park for unloading. Do not home with a model on the bed:
    # _CG28 could cause the printer to crush the model.
    {% if allowed_to_move > 0 %}
        PRESENT_PRINT
    {% endif %}
