#####################################################################
#   Part Cooling Fans
#####################################################################


[gcode_macro _APPLY_PART_FAN_ACTIVE]
# Apply remembered part cooling to the active head, or both synchronized heads.
#
# Usage: _APPLY_PART_FAN_ACTIVE [S=128]
# Parameters: S is a 0-255-style speed, divided by 255; omitted S reuses the
# stored part_fan_speed. No range validation is performed by this helper.
# Behavior: use _FFCP2.mode as the mode proxy; COPY/MIRROR drive both fans,
# other recognized modes drive only the active extruder's fan.
# State: update remembered speed only when S is provided; fan changes persist.
# Unknown mode/tool reports an error message rather than raising a macro error.
variable_part_fan_speed: 0
description: Apply remembered or requested part cooling to active toolhead(s)
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set part_fan_speed = (printer["gcode_macro _APPLY_PART_FAN_ACTIVE"].part_fan_speed) %}

    {% if 'S' in params %}
        SET_GCODE_VARIABLE MACRO=_APPLY_PART_FAN_ACTIVE VARIABLE=part_fan_speed VALUE={params.S | float / 255.0}
        {% set part_fan_speed = (params.S | float / 255.0) %}
        # Optional diagnostic: uncomment to report the normalized speed.
        # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: part_fan_speed={params.S | float / 255.0}"
    {% endif %}

    # Optional diagnostics: uncomment to trace mode and fan routing.
    # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: mode={ffcp2.mode}"
    {% if ffcp2.mode | upper in (['COPY', 'MIRROR']) %}
        # In COPY or MIRROR mode, apply speed to both fans
        # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: setting T0 and T1 part fan speeds"
        SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
        SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
    {% elif ffcp2.mode | upper in (['IDEX', 'T0', 'T1', 'IDLE']) %}
        # In single-tool modes, apply speed to the active extruder
        {% if printer.toolhead.extruder == "extruder" %}
            # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: setting T0 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED=0
        {% elif printer.toolhead.extruder == "extruder1" %}
            # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: setting T1 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED=0
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
        {% else %}
            RESPOND TYPE=error MSG="ERROR: Unable to set part fan speed, no active extruder"
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="ERROR: Unknown print mode."
    {% endif %}


[gcode_macro M106]
# Route slicer fan requests through the mode-aware part-cooling helper.
#
# Usage: M106 S128 [P0]
# Parameters: S is a 0-255-style speed; default 0, unlike stock full-speed
# behavior. P is converted to int; P > 1 is ignored. P <= 1 or omitted P
# controls the active part fan(s), not an independently selected fan index.
# State: update remembered speed and selected fan outputs; no state restoration.
description: Set active part cooling; ignore fan indices above 1
gcode:
    {% if 'P' in params and params.P | int > 1 %}
        # M106 P3 the FFCP2 does not have an enclosure fan: NOOP
        # M106 P2 the FFCP2 does not have an auxiliary fan: NOOP
    {% else %}
        # Whether P1 is specified or omitted, fall through to the
        # part fan.
        {% if 'S' in params %}
            _APPLY_PART_FAN_ACTIVE S={params.S}
        {% else %}
            _APPLY_PART_FAN_ACTIVE S=0
        {% endif %}
    {% endif %}


[gcode_macro M107]
# Turn off the active mode's part cooling through _APPLY_PART_FAN_ACTIVE.
# Usage: M107 [P<index>]; P and all other parameters are ignored.
# State: store speed 0 and apply it to the mode-aware fan outputs.
description: Turn off active part cooling and clear remembered speed
gcode:
    _APPLY_PART_FAN_ACTIVE S=0
