#####################################################################
#   Print Startup
#####################################################################


[gcode_macro START_PRINT]
# Default startup alias; forward all parameters to START_PRINT_T0.
description: Start a T0 single-tool print
gcode:
    START_PRINT_T0 {rawparams}


[gcode_macro START_PRINT_T0]
# Start T0 through _START_PRINT_SINGLETOOL, forwarding parameters with TOOL=0.
# Usage: START_PRINT_T0 BED_TEMP=100 EXTRUDER_TEMP=240
# See the shared helper for defaults, waits, state changes, and safety.
description: Start a T0 single-tool print
gcode:
    _START_PRINT_SINGLETOOL {rawparams} TOOL=0


[gcode_macro START_PRINT_T1]
# Start T1 through _START_PRINT_SINGLETOOL, forwarding parameters with TOOL=1.
# Usage: START_PRINT_T1 BED_TEMP=100 EXTRUDER_TEMP=240
# See the shared helper for defaults, waits, state changes, and safety.
description: Start a T1 single-tool print
gcode:
    _START_PRINT_SINGLETOOL {rawparams} TOOL=1


[gcode_macro _START_PRINT_SINGLETOOL]
# Share startup for the T0 and T1 entry points.
#
# Usage: _START_PRINT_SINGLETOOL TOOL=0 BED_TEMP=100 EXTRUDER_TEMP=240
# Parameters:
#   BED_TEMP: Bed target in C; default -1 skips bed heating/waiting.
#   EXTRUDER_TEMP: Nozzle target in C; default -1 skips heating/waiting.
#   TOOL: Converted to float; 0 selects T0, 1 selects T1. Default: 0.
# Behavior: unlock mode, reset part cooling, select/preheat the requested tool,
# home if needed, use G90, reset E, move Z0, select the tool, wait, then prime.
# Positive BED_TEMP waits within +/-4%; positive EXTRUDER_TEMP waits within
# +/-2%, but nozzle preheating only occurs above _FFCP2.extruder_min_temp.
# Invalid TOOL reports an error message but does not abort the macro.
# State: leave the selected mode locked, targets set, XYZ absolute, E reset,
# and physical position changed. PRIME_LINE restores only its own parsing state.
# Safety: begin with a clear bed and verified calibration. Waits have no timeout;
# a low positive nozzle target can wait without having been set by this macro.
description: Shared single-tool startup with heating, homing, and priming
gcode:
    # The startup procedure is so similar between START_PRINT_T0 and
    # START_PRINT_T1 that code-sharing makes sense here.
    # Parameters
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set bed_temp = params.BED_TEMP | default(-1) | float %}
    {% set extruder_temp = params.EXTRUDER_TEMP | default(-1) | float %}
    {% set tool = params.TOOL | default(0) | float %}

    # We'll change the mode to set up the printer
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False

    # Fans
    # Reset part-cooling fan
    M106 S0

    # Active extruder thermal control
    {% if tool == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% elif tool == 1 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
    {% else %}
        RESPOND TYPE=error MSG="ERROR: Unknown tool"
    {% endif %}

    # Thermal startup
    {% if bed_temp > 0 %}
        RESPOND TYPE=echo MSG="Preheat bed to {bed_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    {% endif %}

    {% if extruder_temp > ffcp2.extruder_min_temp %}
        RESPOND TYPE=echo MSG="Preheat extruder to {extruder_temp}°C"
        {% if tool == 0 %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
        {% elif tool == 1 %}
            SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={extruder_temp}
        {% endif %}
    {% endif %}

    # Mechanical startup
    {% if not printer.pause_resume.is_paused %}
        M117 Homing if needed
    {% endif %}
    # Home all Axes
    _MOTORS_ACTIVE_BARRIER
    # use absolute positioning until otherwise specified
    G90
    # reset extruder
    G92 E0
    G1 Z0

    # Now that motion is active, we can select the tool conventional way.
    {% if tool == 0 %}
        T0
    {% elif tool == 1 %}
        T1
    {% endif %}

    # Wait for temperature
    # Nozzle Temperature Barrier
    {% if extruder_temp > 0 %}
        {% if tool == 0 %}
            {% if not printer.pause_resume.is_paused %}
                M117 Waiting for T0
            {% endif %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp * 0.98} MAXIMUM={extruder_temp * 1.02}
        {% elif tool == 1 %}
            {% if not printer.pause_resume.is_paused %}
                M117 Waiting for T1
            {% endif %}
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={extruder_temp * 0.98} MAXIMUM={extruder_temp * 1.02}
        {% endif %}
    {% endif %}
    {% if bed_temp > 0 %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for bed
        {% endif %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp * 0.96} MAXIMUM={bed_temp * 1.04}
    {% endif %}

    {% if not printer.pause_resume.is_paused %}
        M117 Priming
    {% endif %}
    PRIME_LINE

    # Force printer to stay in this mode for the duration of the print
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=True
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}


[gcode_macro START_PRINT_MIRROR]
# Heat both nozzles and start a locked mirror-mode print.
#
# Usage: START_PRINT_MIRROR BED_TEMP=100 EXTRUDER_TEMP=240
# Parameters: BED_TEMP and EXTRUDER_TEMP are C targets, default -1. Positive bed
# targets heat/wait within +/-4%; nozzle targets above _FFCP2.extruder_min_temp
# heat/wait for both nozzles within +/-2%. Other targets leave heaters unchanged.
# Behavior: unlock mode, reset part cooling, preheat, home if needed, use G90,
# reset E, move Z0, wait, select TMIRROR, prime both nozzles, then lock mode.
# State: retain targets, synchronized extrusion, T0 selection, sensor enables,
# absolute XYZ mode, and changed position. No overall caller-state restoration.
# Safety: clear bed, matched nozzle heights, and verified mirror clearance.
# Waits have no timeout; skipped nozzle heating does not prevent PRIME_LINE.
description: Start a mirror-mode print with both nozzles synchronized
gcode:
    # Parameters
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set bed_temp = params.BED_TEMP | default(-1) | float %}
    {% set extruder_temp = params.EXTRUDER_TEMP | default(-1) | float %}

    # We'll change the mode to set up the printer
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False

    # Fans
    # Reset part-cooling fan
    M106 S0

    # Begin preheating
    {% if bed_temp > 0 %}
        RESPOND TYPE=echo MSG="Preheat bed to {bed_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    {% endif %}

    # FIXME: look up T0 minimum extrude temperature
    {% if extruder_temp > ffcp2.extruder_min_temp %}
        RESPOND TYPE=echo MSG="Preheat T[0-1] to {extruder_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={extruder_temp}
    {% endif %}

    # Mechanical startup
    {% if not printer.pause_resume.is_paused %}
        M117 Homing if needed
    {% endif %}
    # Home all Axes
    _MOTORS_ACTIVE_BARRIER
    # use absolute positioning until otherwise specified
    G90
    # reset extruder
    G92 E0
    G1 Z0

    # Wait for preheating
    # Nozzle Temperature Barrier
    {% if extruder_temp > ffcp2.extruder_min_temp %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for nozzles
        {% endif %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp * 0.98} MAXIMUM={extruder_temp * 1.02}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={extruder_temp * 0.98} MAXIMUM={extruder_temp * 1.02}
    {% endif %}
    {% if bed_temp > 0 %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for bed
        {% endif %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp * 0.96} MAXIMUM={bed_temp * 1.04}
    {% endif %}

    # Sync motions T0 -> T1
    TMIRROR

    {% if not printer.pause_resume.is_paused %}
        M117 Priming
    {% endif %}
    PRIME_LINE

    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=True
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}


[gcode_macro START_PRINT_COPY]
# Heat both nozzles and start a locked copy-mode print.
#
# Usage: START_PRINT_COPY BED_TEMP=100 EXTRUDER_TEMP=240
# Parameters: BED_TEMP and EXTRUDER_TEMP are C targets, default -1. Positive bed
# targets heat/wait within +/-4%; nozzle targets above _FFCP2.extruder_min_temp
# heat/wait for both nozzles within +/-2%. Other targets leave heaters unchanged.
# Behavior: unlock mode, reset part cooling, preheat, home if needed, use G90,
# reset E, move Z0, wait, select TCOPY, prime both nozzles, then lock mode.
# State: retain targets, synchronized extrusion, T0 selection, sensor/offset/fan
# changes from TCOPY, absolute XYZ mode, and changed position.
# Safety: clear bed, matched nozzle heights, and verified copy separation.
# Waits have no timeout; skipped nozzle heating does not prevent PRIME_LINE.
description: Start a copy-mode print with both nozzles synchronized
gcode:
    # Note: I've chosen to just print in the 2-head overlapping area to keep
    # the cooridnate system simple.
    # An optimization might be to set the corner of the bed to about (-10,0,0)
    # in the slicer and increase
    # the gap here to increase the sizes of the copied objects a bit, but I'm
    # optimizing for easy-to-read
    # code at this point in the process so playing coordinate games in muliple
    # layers of the software
    # can happen later.

    # Parameters
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set bed_temp = params.BED_TEMP | default(-1) | float %}
    {% set extruder_temp = params.EXTRUDER_TEMP | default(-1) | float %}

    # We'll change the mode to set up the printer
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False

    # Fans
    # Reset part-cooling fan
    M106 S0

    # Begin preheating
    {% if bed_temp > 0 %}
        RESPOND TYPE=echo MSG="Preheat bed to {bed_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    {% endif %}

    # FIXME: look up T0 minimum extrude temperature
    {% if extruder_temp > ffcp2.extruder_min_temp %}
        RESPOND TYPE=echo MSG="Preheat T[0-1] to {extruder_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={extruder_temp}
    {% endif %}

    # Mechanical startup
    {% if not printer.pause_resume.is_paused %}
        M117 Homing if needed
    {% endif %}
    # Home all Axes
    _MOTORS_ACTIVE_BARRIER
    # use absolute positioning until otherwise specified
    G90
    # reset extruder
    G92 E0
    G1 Z0

    # Wait for preheating
    # Nozzle Temperature Barrier
    {% if extruder_temp > ffcp2.extruder_min_temp %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for nozzles
        {% endif %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp * 0.98} MAXIMUM={extruder_temp * 1.02}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={extruder_temp * 0.98} MAXIMUM={extruder_temp * 1.02}
    {% endif %}
    {% if bed_temp > 0 %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for bed
        {% endif %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp * 0.96} MAXIMUM={bed_temp * 1.04}
    {% endif %}

    # Synchronize T0 and T1
    # We do this after the preheat has been completed so that we don't cook
    # some sport on the build plate.
    TCOPY

    {% if not printer.pause_resume.is_paused %}
        M117 Priming
    {% endif %}
    PRIME_LINE

    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=True
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}


[gcode_macro START_PRINT_IDEX]
# Preheat and select the initial tool for a toolswapping print.
#
# Usage: START_PRINT_IDEX BED_TEMP=100 T0_TEMP=240 T1_TEMP=240 TOOL=0
# Parameters:
#   BED_TEMP: Bed target in C; default -1 skips bed heating/waiting.
#   T0_TEMP, T1_TEMP: Nozzle targets in C; default 200 each. Heating/waiting
#     occurs only above _FFCP2.extruder_min_temp; other targets are not applied.
#   TOOL: Initial nozzle, converted to int; 1 selects T1, all others select T0.
#     Default: 0.
# Behavior: unlock mode, reset part cooling, preheat, home if needed, use G90,
# reset E, move Z0, select the initial tool, then wait for requested temperatures.
# No priming line is called; nozzle tolerance is +/-2%, bed tolerance +/-4%.
# State: leave mode unlocked for later tool changes; T0/T1 sets the tracked mode
# to that tool, not the literal IDEX. Targets and tool/fan/sensor/offset changes
# persist. No overall caller-state restoration.
# Safety: clear bed and verified tool offsets; temperature waits have no timeout.
description: Start an unlocked toolswapping print with separate nozzle targets
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set bed_temp = params.BED_TEMP | default(-1) | float %}
    {% set t0_temp = params.T0_TEMP | default(200) | float %}
    {% set t1_temp = params.T1_TEMP | default(200) | float %}
    # Select the active nozzle on startuyp
    {% set tool = params.TOOL | default(0) | int %}

    # We're in native mode, trust the job g-code to set the print-mode
    # appripriately.
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False

    # Fans
    # Reset part-cooling fan
    M106 S0

    # Thermal startup
    {% if bed_temp > 0 %}
        RESPOND TYPE=echo MSG="Preheat bed to {bed_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    {% endif %}

    # FIXME: look up T0 minimum extrude temperature
    {% if t0_temp > ffcp2.extruder_min_temp %}
        RESPOND TYPE=echo MSG="Preheat T0 to {t0_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t0_temp}
    {% endif %}

    # FIXME: look up T1 minimum extrude temperature
    {% if t1_temp > ffcp2.extruder_min_temp %}
        RESPOND TYPE=echo MSG="Preheat T1 to {t1_temp}°C"
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={t1_temp}
    {% endif %}

    # Mechanical startup
    {% if not printer.pause_resume.is_paused %}
        M117 Homing if needed
    {% endif %}
    # Home all Axes
    _MOTORS_ACTIVE_BARRIER
    # use absolute positioning until otherwise specified
    G90
    # reset extruder
    G92 E0
    G1 Z0

    # Select the active nozzle
    {% if tool == 0 %}
        T0
    {% elif tool == 1 %}
        T1
    {% else %}
        T0
    {% endif %}

    # Wait for temperature
    # Nozzle Temperature Barrier
    # FIXME: look up T0 minimum extrude temperature
    {% if t0_temp > ffcp2.extruder_min_temp %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for T0
        {% endif %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t0_temp * 0.98} MAXIMUM={t0_temp * 1.02}
    {% endif %}
    # FIXME: look up T1 minimum extrude temperature
    {% if t1_temp > ffcp2.extruder_min_temp %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for T1
        {% endif %}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={t1_temp * 0.98} MAXIMUM={t1_temp * 1.02}
    {% endif %}
    {% if bed_temp > 0 %}
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for bed
        {% endif %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp * 0.96} MAXIMUM={bed_temp * 1.04}
    {% endif %}
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}
