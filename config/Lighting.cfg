#####################################################################
#   Lighting
#####################################################################
[delayed_gcode chamber_lights_on_boot]
# Attach the continuous display template one second after startup.
# State: chamber_led follows chamber_led_template until replaced or cleared.
initial_duration: 1.0
gcode:
    # Attach the template (this is what makes it "continuous")
    SET_LED_TEMPLATE LED=chamber_led TEMPLATE=chamber_led_template

[display_template chamber_led_template]
# Return RGBW components for the NeoPixel template; no parameters or motion.
# Priority: printing, paused, complete, standby, then the fallback for
# error/cancelled/other states. Heater temperatures do not affect the lights.
# This is a continuously evaluated status display, not a safety interlock.
text:
    {% if printer.print_stats.state | lower == "printing" %}
        # Running lights
        1.0, 1.0, 1.0, 1.0
    {% elif printer.print_stats.state | lower == "paused" %}
        # Fixme lights
        0.0, 1.0, 1.0, 0.4
    {% elif printer.print_stats.state | lower == "complete" %}
        # Success lights
        0.0, 1.0, 0.0, 0.4
    {% elif printer.print_stats.state | lower == "standby" %}
        # Sleepy lights
        0.0, 0.0, 0.5, 0.4
    {% else %}
        # Covers "error" and "canceled" states.
        # Error lights
        1.0, 0.0, 0.0, 0.4
    {% endif %}
