
##############################
# Macros
##############################

# Note: Heavily based on https://github.com/eazrael/klipper/blob/ffcp2/config/printer-flashforge-creator-pro2-macros.cfg


#####
# Calibration Management
####
[gcode_macro _FFCP2_CONFIG]
variable_wipe_on_activate: False
variable_t1_nozzle_adjust_x: 0
variable_t1_nozzle_adjust_y: 0
variable_t1_nozzle_adjust_z: 0.18
# TODO: input shaping settings and pressure advance
gcode:
    ; No op, just save some state


[gcode_macro SET_T1_ADJUSTMENTS]
gcode:
    {% if params.OP|lower == 'revert' %}
        SET_GCODE_OFFSET X_ADJUST={(-printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_x|float)}
        SET_GCODE_OFFSET Y_ADJUST={(-printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_y|float)}
        SET_GCODE_OFFSET Z_ADJUST={(-printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_z|float)}
    {% else %}
        SET_GCODE_OFFSET X_ADJUST={(printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_x|float)}
        SET_GCODE_OFFSET Y_ADJUST={(printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_y|float)}
        SET_GCODE_OFFSET Z_ADJUST={(printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_z|float)}
    {% endif %}



#####
# Basic Motions
######

[gcode_macro G28]
rename_existing: G28.0
description: Autohome. Usage: G28 [X] [Y] [Z]
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    G28.0 {rawparams}

    ; When homing Y, move it to 0 to prevent cable stress
    {% if (params.X is undefined and params.Z is undefined) or params.Y is defined  %}
        SAVE_GCODE_STATE
        G90
        G1 Y0
        RESTORE_GCODE_STATE
    {% endif %}

    ; When homing Z, lower it afterwards to prevent crashes and scratches
    {% if (params.X is undefined and params.Y is undefined) or params.Z is defined  %}
        SAVE_GCODE_STATE
        G90
        #G1 Z10
        G0 Z0
        RESTORE_GCODE_STATE
    {% endif %}

    {% if printer.toolhead.extruder != active_extruder %}
        ACTIVATE_EXTRUDER EXTRUDER={active_extruder}
    {% endif %}
    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}


# Park Primary Extruder
# Park at left endstop
[gcode_macro PARK_LEFT_EXTRUDER]
gcode:
    #Check active extruder!!!!
    {% if printer.dual_carriage['carriage_0'] != 'PRIMARY' %}
        RESPOND MSG="Can only park left extruder when PRIMARY in IDEX mode"
        { action_raise_error("Can only park left extruder when PRIMARY in IDEX mode") }
    {% endif %}

    SAVE_GCODE_STATE NAME=park0
    G90
    G1 X{printer.configfile.settings["stepper_x"]["position_endstop"]|float} F{printer.toolhead.max_velocity * 60.0}
    SET_FAN_SPEED FAN=extruder_part_fan SPEED=0.0
    RESTORE_GCODE_STATE NAME=park0


# Park Secondary Extruder
# Park at right endstop
[gcode_macro PARK_RIGHT_EXTRUDER]
gcode:
    {% if printer.dual_carriage['carriage_0'] != 'INACTIVE' %}
        RESPOND MSG="Can only park right extruder when PRIMARY in IDEX mode"
        { action_raise_error("Can only park right extruder when PRIMARY in IDEX mode") }
    {% endif %}

    SAVE_GCODE_STATE NAME=park1
    G90
    G1 X{printer.configfile.settings["dual_carriage"]["position_endstop"]|float} F{printer.toolhead.max_velocity * 60.0}
    SET_FAN_SPEED FAN=right_part_fan SPEED=0.0
    RESTORE_GCODE_STATE NAME=park1


