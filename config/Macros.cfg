#####
# Basic Motions
######

[gcode_macro G28]
rename_existing: G28.0
description: Autohome. Usage: G28 [X] [Y] [Z]
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    G28.0 {rawparams}

    ; When homing Y, move it to 0 to prevent cable stress
    {% if (params.X is undefined and params.Z is undefined) or params.Y is defined  %}
        SAVE_GCODE_STATE
        G90
        G1 Y0
        RESTORE_GCODE_STATE
    {% endif %}

    ; When homing Z, lower it afterwards to prevent crashes and scratches
    {% if (params.X is undefined and params.Y is undefined) or params.Z is defined  %}
        SAVE_GCODE_STATE
        G90
        #G1 Z10
        G0 Z0
        RESTORE_GCODE_STATE
    {% endif %}

    {% if printer.toolhead.extruder != active_extruder %}
        ACTIVATE_EXTRUDER EXTRUDER={active_extruder}
    {% endif %}
    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}


# Park Primary Extruder
# Park at left endstop
[gcode_macro PARK_T0]
gcode:
    #Check active extruder!!!!
    {% if printer.dual_carriage['carriage_0'] != 'PRIMARY' %}
        RESPOND MSG="Can only park left extruder when PRIMARY in IDEX mode"
        { action_raise_error("Can only park left extruder when PRIMARY in IDEX mode") }
    {% endif %}

    SAVE_GCODE_STATE NAME=park0
    G90
    G1 X{printer.configfile.settings["stepper_x"]["position_endstop"]|float} F{printer.toolhead.max_velocity * 60.0 + 0.1}
    RESTORE_GCODE_STATE NAME=park0


# Park Secondary Extruder
# Park at right endstop
[gcode_macro PARK_T1]
gcode:
    {% if printer.dual_carriage['carriage_0'] != 'INACTIVE' %}
        RESPOND MSG="Can only park right extruder when PRIMARY in IDEX mode"
        { action_raise_error("Can only park right extruder when PRIMARY in IDEX mode") }
    {% endif %}

    SAVE_GCODE_STATE NAME=park1
    G90
    G1 X{printer.configfile.settings["dual_carriage"]["position_endstop"]|float} F{printer.toolhead.max_velocity * 60.0 - 0.1}
    RESTORE_GCODE_STATE NAME=park1


# Move the active extruder to Loading Position
[gcode_macro _POSITION_FILAMENTLOAD]
description: Helper: park the active toolhead for LOAD_FILAMENT, UNLOAD_FILAMENT and PAUSE.  This location is a safe place to poop.
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    {% if active_extruder == "extruder" %}
	# Start Z-Hop
	G91
	G0 Z0.2 # Start Z-Hop

	# Put the left toolhead where it belongs
	G90
        {% set stepper_x=printer.configfile.settings["stepper_x"] %}
	G0 X{stepper_x.position_endstop + printer["gcode_macro _FFCP2_CONFIG"].active_parking_offset} Y{ printer.toolhead.axis_maximum.y/2 } 
	
	# Finish Z-Hop
	G91
	G0 Z-0.2 # Finish Z-Hop
    {% elif active_extruder == "extruder1" %}
	# Start Z-Hop
	G91
	G0 Z0.2

	# Put the right toolhead where it belongs
    	G90
        {% set stepper_x1 = printer.configfile.settings["dual_carriage"] %}
	G0 X{stepper_x1.position_endstop - printer["gcode_macro _FFCP2_CONFIG"].active_parking_offset} Y{ printer.toolhead.axis_maximum.y/2 } # FIXME: Factor out this machine size parameter
	
	# Finish Z-Hop
	G91
	G0 Z-0.2
    {% else %}
    	RESPOND MSG="ERROR: Cannot move { 'active_extruder' } into filament-load position."
    {% endif %}

[gcode_macro _IDEX_PARK_JOBDONE]
# Park the axes so that the operator can unload the machine
gcode:
    T0
    PARK_T0
    T1
    PARK_T1
    G0 Y{printer.configfile.settings["stepper_y"]["position_max"]|float}
    G0 Z{printer.configfile.settings["stepper_z"]["position_max"]|float}


#####
# Tool Changes
#####

[gcode_macro T0]
description: Activate the left extruder (extruder) in IDEX mode
gcode:
    SAVE_GCODE_STATE NAME=t0_state
    {% if printer.toolhead.extruder != 'extruder' %}
        PARK_T1
        OFFSET_T0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        _APPLY_PART_FAN_ACTIVE
    {% endif %}
    RESTORE_GCODE_STATE NAME=t0_state


[gcode_macro T1]
description: Activate the right extruder (extruder1) in IDEX mode
gcode:
    SAVE_GCODE_STATE NAME=t1_state
    {% if printer.toolhead.extruder != 'extruder1' %}
        PARK_T0
        OFFSET_T1
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1
        _APPLY_PART_FAN_ACTIVE
    {% endif %}
    RESTORE_GCODE_STATE NAME=t1_state


[gcode_macro _ACTIVATE_COPY_MODE]
description: Setup for Copy & Mirror Modes
gcode:
    {% set mode = params.MODE %}
    {% set min_left = printer.configfile.settings.dual_carriage.position_min|float %}
    {% set center_x = printer.configfile.settings["stepper_x"]["position_max"]|float / 2 %}  # We assume that T0's axis is aligned such that (0,0) is at the front/left edge of the build-plate, and that the end_stop is at a negative value.

    # FIXME: Choose maximum tool offset (rather than the average) to avoid scraping the build-plate
    SET_GCODE_OFFSSET Z={(printer["gcode_macro _FFCP2_CONFIG"].t0_nozzle_adjust_z|float + printer["gcode_macro _FFCP2_CONFIG"].t1_nozzle_adjust_z|float) / 2 }

    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    G1 X{center_x} F{printer.toolhead.max_velocity * 60.0}

    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    G1 X0 F{printer.toolhead.max_velocity * 60.0}

    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=copy
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    G92 X0 Y0 # Whever we are, it's the origin now!

# A helper script to activate copy mode
[gcode_macro ACTIVATE_COPY_MODE]
gcode:
    _ACTIVATE_COPY_MODE

# A helper script to activate mirror mode
[gcode_macro ACTIVATE_MIRROR_MODE]
gcode:
    _ACTIVATE_MIRROR_MODE



#####
# Heating and Cooling
#####

[gcode_macro _NOZZLE_HOT_ACTIVE]
description: Helper macro to ensure that the nozzle is hot enough to perform filament-management functions like loading, unloading, wiping, or priming.
gcode:
    # How hot should the nozzle be?
    {% if printer.extruder.target|int > 200 %}
       # If the operator or gcode selected a sane temperature, go with it
       {% set target_temp = printer.extruder.target|int %}
    {% else %}
       # The operator did not select a temperature, so let's go with the machine's default
       {% set target_temp  = printer['gcode_macro _FFCP2_CONFIG'].load_filament_extruder_temp|int %}
    {% endif %}

    # Ensure the nozzle is hot
    M104 S{target_temp}
    M109 S{target_temp}


[gcode_macro _APPLY_PART_FAN_ACTIVE]
variable_part_fan_speed = 0
description: Set the active part fan fan speed, shut down all others. Usage: _PART_FAN_ACTIVE [S<speed>]
gcode:
    {% set part_fan_speed=(printer["gcode_macro _APPLY_PART_FAN_ACTIVE"].part_fan_speed) %}
    {% if 'S' in params %}
        SET_GCODE_VARIABLE MACRO=_APPLY_PART_FAN_ACTIVE VARIABLE=part_fan_speed VALUE={params.S|default(255)|float / 255.0}
        {% set part_fan_speed=(params.S|default(255)|float / 255.0) %}
    	#RESPOND type=echo MSG="part_fan_speed={params.S|default(255)|float / 255.0}"
    {% endif %}

    {% if printer.dual_carriage['carriage_1'] is in (['COPY', 'MIRROR']) %}
        # In copy or mirror mode, both fans should be on
        #RESPOND type=echo MSG="Setting T0,T1 part fan speed"
        SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
        SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
    {% else %}
        # In IDEX mode, we want the fan on the current tool running at the
        # requested speed and on and all others turned off.
        {% if printer.toolhead.extruder == "extruder" %}
            #RESPOND type=echo MSG="Setting T0 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED=0
        {% elif printer.toolhead.extruder == "extruder1" %}
            #RESPOND type=echo MSG="Setting T1 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED=0
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
        {% else %}
            RESPOND type=error MSG="Unable to set part fan speed, no active extruder"
        {% endif %}
    {% endif %}


# It seems that cura does not control the second fan in copy/mirror mode, so we
# have to take care of that.
[gcode_macro M106]
description: Set Fan Speed. Usage: M106 [S<speed>]
gcode:
    {% if 'P' in params and params.P|int > 1 %}
        # M106 P3 the FFCP2 does not have an enclosure fan: NOOP
        # M106 P2 the FFCP2 does not have an auxilliary fan: NOOP
    {% else %}
        # Since P1 may or may be specified or omitted, we fall through to the part fan.
        {% if 'S' in params %}
            _APPLY_PART_FAN_ACTIVE S={params.S}
        {% else %}
            _APPLY_PART_FAN_ACTIVE S=0
        {% endif %}
   {% endif %}


[gcode_macro M107]
description: Fan Off. Usage: M107 [P<index>]
gcode:
    _APPLY_PART_FAN_ACTIVE S=0


#####
# Filament Management
#####

[gcode_macro LOAD_FILAMENT]
gcode:
    _POSITION_FILAMENTLOAD
    {% set extruder_temp = printer['gcode_macro _FFCP2_CONFIG'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{extruder_temp}
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        RESPOND type=echo MSG="Extruding..."
        G91
	G1 E20 F300
        G1 E15 F150
        G90
        M400
        RESPOND type=echo MSG="Extrude Finish"
	G12
        M400
        RESPOND type=echo MSG="Nozzle Wipe Finish"
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't load filament during printing!!!")}
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _FFCP2_CONFIG'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            RESPOND type=echo MSG="Nozzle heating..."
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                RESPOND type=echo MSG="Nozzle heating..."
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{printer.extruder.target}
                RESPOND type=echo MSG="Nozzle heating..."
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
        RESPOND type=echo MSG="Retracting..."
        G91
        G1 E+15 F300
        G1 E-10 F1500
        G1 E-20 F600
        M400
        G4 P3000
        G1 E-50 F300
        G90
        M400
        RESPOND type=echo MSG="Retract Finish"
        M400
        {% if current_target_temp == 0 or printer.print_stats.state != "paused"%}
            M104 S0
        {% endif %}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}


[gcode_macro PRIME_NOZZLE]
description: Prime the active nozzle command. Usage: PRIME_NOZZLE [S<count>]
gcode:
    # Ensure the nozzle is hot
    {% set extruder_temp = printer['gcode_macro _FFCP2_CONFIG'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{extruder_temp}
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
    {% endif %}
 
    # Poop & Park Quickly
    {% set clean_count = params.S|default(3)|int %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set stepper_x1=printer.configfile.settings["dual_carriage"] %}
    {% if printer.extruder.target == 0 %}
	# Position
        G0 X{stepper_x.position_endstop + printer["gcode_macro _FFCP2_CONFIG"].active_parking_offset} F{printer.toolhead.max_velocity * 60.0}

	# Poop
        G1 E30 F150

        # Park
        PARK_T0

    {% elif printer.extruder.target == 1 %}
	# Position
        G0 X{printer.configfile.settings["dual_carriage"]["position_max"]|float - printer["gcode_macro _FFCP2_CONFIG"].active_parking_offset} F{printer.toolhead.max_velocity * 60.0}

        # Poop
        G1 E30 F150

        # Park
        PARK_T1
    {% else %}
	# No nozzle selected, do nothing
        #RESPOND type=info MSG="PRIME_NOZZLE: No nozzle selected"
    {% endif %}


[gcode_macro CLEAN_NOZZLE]
description: Clean the active nozzle. Usage: CLEAN_NOZZLE [S<count>]
gcode:
    # Ensure the nozzle is hot
    {% set extruder_temp = printer['gcode_macro _FFCP2_CONFIG'].load_filament_extruder_temp|int %}
    {% set current_target_temp  = printer.extruder.target|int %}

    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" %}
            M104 S{extruder_temp}
            {action_respond_info("Nozzle not hot enough!")}
            {action_respond_info("Nozzle heating...")}
            M109 S{extruder_temp}
        {% else %}
            {% if printer.extruder.target == 0 %}
                M104 S{extruder_temp}
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{extruder_temp}
            {% else %}
                M104 S{extruder_temp}
                {action_respond_info("Nozzle not hot enough!")}
                {action_respond_info("Nozzle heating...")}
                M109 S{printer.extruder.target}
            {% endif %}
        {% endif %}
    {% endif %}
 
    # Perform the cleaning motion
    {% set clean_count = params.S|default(3)|int %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set stepper_x1=printer.configfile.settings["dual_carriage"] %}
    {% for i in range(clean_count) %}
        {% if printer.toolhead.extruder == 'extruder' %}
		G0 X{stepper_x.position_endstop} F{printer.toolhead.max_velocity * 60.0}
		G0 X{stepper_x.position_endstop + printer["gcode_macro _FFCP2_CONFIG"].active_parking_offset} F{printer.toolhead.max_velocity * 60.0}
		G0 X{stepper_x.position_endstop} F{printer.toolhead.max_velocity * 60.0}
        {% elif printer.toolhead.extruder == 'extruder1' %} 
		G0 X{stepper_x1.position_endstop} F{printer.toolhead.max_velocity * 60.0}
		G0 X{stepper_x1.position_endstop - printer["gcode_macro _FFCP2_CONFIG"].active_parking_offset} F{printer.toolhead.max_velocity * 60.0}
		G0 X{stepper_x1.position_endstop} F{printer.toolhead.max_velocity * 60.0}
        {% endif %}
    {% endfor %}

[gcode_macro G12]
description: Clean the active nozzle. Usage: G12 [S<count>]
gcode:
    CLEAN_NOZZLE {rawparams}


#####
# Job Management
#####


[gcode_macro START_PRINT]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  ### Parameters ###
  {% set BED_TEMP = params.BED_TEMP|default(55)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}
  {% set TOOL = params.TOOL|default(0)|int %}
  
  ### Lights and Fans ###
  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0
  M106 S0 ; Reset part-cooling fan

  ### Active Extruder Thermal Control ###
  {% if TOOL == 0 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
  {% elif TOOL == 1 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
  {% else %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
  {% endif %}

  ### Thermal Startup ###
  {% if params.BED_TEMP != "0" %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > 0 %}
    SET_HEATER_TEMPERATURE HEATER={printer.toolhead.extruder} TARGET={EXTRUDER_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0 

  # Activate Extruder Motion Control
  {% if TOOL == 0 %}
    SET_DUAL_CARRIAGE CARRIAGE=0
  {% elif TOOL == 1 %}
    SET_DUAL_CARRIAGE CARRIAGE=1
  {% else %}
    SET_DUAL_CARRIAGE CARRIAGE=0
  {% endif %}


  ### Wait for Temperature ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > 0 %}
    TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% endif %}
  {% if params.BED_TEMP != "0" %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Now that we're warmed up, set the lights to run-mode
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1



[gcode_macro START_PRINT_GENERAL]
description: Generalized print start.
gcode:
  #Get Bed and Extruder temperature from Slicer GCode
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set T0_TEMP = params.T0_TEMP|default(-1)|float %}  # Used in IDEX tool swapping mode
  {% set T1_TEMP = params.T1_TEMP|default(-1)|float %}  # Used in IDEX tool swapping mode
  {% set IDEX_MODE = params.IDEX_MODE|default('IDEX')|lower %}
  {% set INITIAL_EXTRUDER = params.START_EXTRUDER|default(0)|int %}
  #RESPOND TYPE=echo MSG="START_PRINT"
  #RESPOND TYPE=echo MSG="START_PRINT IDEX Mode: {IDEX_MODE}"
  #RESPOND TYPE=echo MSG="START_PRINT IDEX Mode: {IDEX_MODE}"
  #RESPOND TYPE=echo MSG="START_PRINT BED_TEMP: {BED_TEMP}"
  #RESPOND TYPE=echo MSG="START_PRINT INITIAL_EXTRUDER: {INITIAL_EXTRUDER}"
  #RESPOND TYPE=echo MSG="START_PRINT EXTRUDER_TEMP: {EXTRUDER_TEMP}"
  #RESPOND TYPE=echo MSG="START_PRINT T0_TEMP: {T0_TEMP}"
  #RESPOND TYPE=echo MSG="START_PRINT T1_TEMP: {T1_TEMP}"

  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  M106 S0 ; Reset part-cooling fan

  # Bed Heating (non-blocking) 
  {% if params.BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  # Extruder Preheating (non-Blocking)
  {% if IDEX_MODE == 'copy' %}
    RESPOND TYPE=echo MSG="Copy mode"
    ACTIVATE_COPY_MODE
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% elif IDEX_MODE == 'mirror' %}
    RESPOND TYPE=echo MSG="Mirror mode"
    ACTIVATE_MIRROR_MODE
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% else %} # default to idex toolswapper mode
    RESPOND TYPE=echo MSG="Idex mode"

    # Select the initial extruder
    {% if inital_extruder == 1 %}
      T1
    {% else %}
      T0
    {% endif %}

    # Preheat Extruder(s) (non-blocking)
    {% if T0_TEMP > 0 %} # FIXME: look up T0 minimum extrude temperature
      RESPOND TYPE=echo MSG="Preheat T0 to {T0_TEMP}°C"
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={T0_TEMP}
    {% endif %}
    {% if T1_TEMP > 0 %} # FIXME: look up T1 minimum extrude temperature
      RESPOND TYPE=echo MSG="Preheat T1 to {T1_TEMP}°C"
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={T1_TEMP}
    {% endif %}

    # Nozzle Temperature Barrier
    {% if T0_TEMP > 100 %} # FIXME: look up T0 minimum extrude temperature
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T0_TEMP*0.98} MAXIMUM={T0_TEMP*1.02}
    {% endif %}
    {% if T1_TEMP > 100 %} # FIXME: look up T1 minimum extrude temperature
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={T1_TEMP*0.98} MAXIMUM={T1_TEMP*1.02}
    {% endif %}

    # Set active nozzle
    {% if INITIAL_EXTRUDER == 0 %}
      T0
    {% elif INITIAL_EXTRUDER == 1 %}
      T1
    {% else %}
      T0
    {% endif %}

  {% endif %}

  {% if params.BED_TEMP != "0" %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Position bed for printing
  G1 Z0 
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1


[gcode_macro START_PRINT_IDEX]
description: Start a multi-tool print.
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(55)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}  # Used when both extruders are running the same temperature
  {% set T0_TEMP = params.T0_TEMP|default(200)|float %}  # Used in IDEX tool swapping mode
  {% set T1_TEMP = params.T1_TEMP|default(200)|float %}  # Used in IDEX tool swapping mode
  {% set TOOL = params.TOOL|default(0)|int %}
  #RESPOND TYPE=echo MSG="START_PRINT"
  #RESPOND TYPE=echo MSG="START_PRINT BED_TEMP: {BED_TEMP}"
  #RESPOND TYPE=echo MSG="START_PRINT INITIAL_EXTRUDER: {INITIAL_EXTRUDER}"
  #RESPOND TYPE=echo MSG="START_PRINT EXTRUDER_TEMP: {EXTRUDER_TEMP}"
  #RESPOND TYPE=echo MSG="START_PRINT T0_TEMP: {T0_TEMP}"
  #RESPOND TYPE=echo MSG="START_PRINT T1_TEMP: {T1_TEMP}"

  ### Lights and Fans ###
  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0
  M106 S0 ; Reset part-cooling fan

  ### Thermal Startup ###
  {% if params.BED_TEMP != "0" %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if T0_TEMP > 100 %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T0 to {T0_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={T0_TEMP}
  {% endif %}

  {% if T1_TEMP > 100 %} # FIXME: look up T1 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T1 to {T1_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={T1_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0 

  # Set active nozzle
  {% if TOOL == 0 %}
    T0
  {% elif TOOL == 1 %}
    T1
  {% else %}
    T0
  {% endif %}

  ### Wait for Temperature ###
  # Nozzle Temperature Barrier
  {% if T0_TEMP > 100 %} # FIXME: look up T0 minimum extrude temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T0_TEMP*0.98} MAXIMUM={T0_TEMP*1.02}
  {% endif %}
  {% if T1_TEMP > 100 %} # FIXME: look up T1 minimum extrude temperature
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={T1_TEMP*0.98} MAXIMUM={T1_TEMP*1.02}
  {% endif %}
  {% if params.BED_TEMP != "0" %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Now that we're warmed up, set the lights to run-mode
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1



[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    SET_LED LED=enclosure_led RED=1 GREEN=0 BLUE=0 WHITE=0.2
    PAUSE_BASE
    RESPOND type=echo MSG="Pause Print!!!"
    _POSITION_FILAMENTLOAD # Put the nozzle in a safe place so it doesn't cook the model, plus we're probably going to have to reload the filament anyway.

[gcode_macro RESUME]
description: Pause the actual running print
rename_existing: RESUME_BASE
gcode:
    PAUSE_BASE
    SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1



[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
        # Don't shut off the motors while printing
        # FIXME: look up time from configuration macros
        RESPOND type=echo MSG="Printer has been sitting idle for { (printer.configfile.settings["idle_timeout"]["timeout"]|float) / 60 } mintues."
    {% else %}
        # If we time out, park the axes for easy model-access
        TURN_OFF_HEATERS
        M107 P0 # Turn off fans
        M107 P1
        _IDEX_PARK_JOBDONE
        M84
    {% endif %}


[gcode_macro END_PRINT]
gcode:
  TURN_OFF_HEATERS
  M107 P0 # Turn off fans
  M107 P1
  _IDEX_PARK_JOBDONE
  M18 # Turn off Steppers
  SET_LED LED=enclosure_led RED=0 GREEN=1 BLUE=0 WHITE=0.2


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  TURN_OFF_HEATERS
  M107 P0 # Turn off fans
  M107 P1
  _IDEX_PARK_JOBDONE
  M18 # Turn off Steppers
  CANCEL_PRINT_BASE
  SET_LED LED=enclosure_led RED=1 GREEN=0 BLUE=0 WHITE=0

