# Macros
##############################

# Acknowledgements:
# 	- Evil Azreal's FFCP2 Conversion: https://github.com/eazrael/klipper/blob/ffcp2/config/printer-flashforge-creator-pro2-macros.cfg
# 	- Klipper Example Macros


#####
# Basic Motions
######

[gcode_macro G28]
rename_existing: G28.0
description: Autohome. Usage: G28 [X] [Y] [Z]
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    G28.0 {rawparams}

    ; When homing Y, move it to 0 to prevent cable stress
    {% if (params.X is undefined and params.Z is undefined) or params.Y is defined  %}
        SAVE_GCODE_STATE
        G90
        G1 Y0
        RESTORE_GCODE_STATE
    {% endif %}

    ; When homing Z, lower it afterwards to prevent crashes and scratches
    {% if (params.X is undefined and params.Y is undefined) or params.Z is defined  %}
        SAVE_GCODE_STATE
        G90
        #G1 Z10
        G0 Z0
        RESTORE_GCODE_STATE
    {% endif %}

    {% if printer.toolhead.extruder != active_extruder %}
        ACTIVATE_EXTRUDER EXTRUDER={active_extruder}
    {% endif %}
    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}


[gcode_macro PARK_ACTIVE]
description: Park the active toolhead
gcode:
    {% if printer.dual_carriage['carriage_0'] != 'PRIMARY' %}
      PARK_T0
    {% elif printer.dual_carriage['carriage_1'] != 'PRIMARY' %}
      PARK_T1
    {% else %}
      RESPOND type=error MSG="No carriage selected"
    {% endif %}
 
# Park Primary Extruder
# Park at left endstop
[gcode_macro PARK_T0]
description: Park T0, regardless of whether it is active or not.  Ignore motion-sync issues for COPY and MIRROR modes.
gcode:
    SAVE_GCODE_STATE NAME=PARK_T0
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T0 

    # Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 to move independently

    # Perform the move
    G90
    G1 X{printer.configfile.settings["stepper_x"]["position_endstop"]|float} F{printer.toolhead.max_velocity * 60.0 + 0.1}

    # Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T0 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T0 MOVE=0


# Park Secondary Extruder
# Park at right endstop
[gcode_macro PARK_T1]
gcode:
    SAVE_GCODE_STATE NAME=PARK_T1
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T1 

    # Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=1
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1  # Set T1 to move independently

    # Perform the move
    G90
    G1 X{printer.configfile.settings["dual_carriage"]["position_endstop"]|float} F{printer.toolhead.max_velocity * 60.0 + 0.1}

    # Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T1 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T1 MOVE=0


# Move the active extruder to Loading Position
[gcode_macro _POSITION_FILAMENTLOAD]
description: Helper: park the active toolhead for LOAD_FILAMENT, UNLOAD_FILAMENT and PAUSE.  This location is a safe place to poop.
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    {% if active_extruder == "extruder" %}
	# Start Z-Hop
	G91
	G0 Z0.2 # Start Z-Hop

	# Put the left toolhead where it belongs
	G90
        {% set stepper_x=printer.configfile.settings["stepper_x"] %}
	G0 X{stepper_x.position_endstop + printer["gcode_macro _FFCP2"].active_parking_offset} Y{ printer.toolhead.axis_maximum.y/2 } 
	
	# Finish Z-Hop
	G91
	G0 Z-0.2 # Finish Z-Hop
    {% elif active_extruder == "extruder1" %}
	# Start Z-Hop
	G91
	G0 Z0.2

	# Put the right toolhead where it belongs
    	G90
        {% set stepper_x1 = printer.configfile.settings["dual_carriage"] %}
	G0 X{stepper_x1.position_endstop - printer["gcode_macro _FFCP2"].active_parking_offset} Y{ printer.toolhead.axis_maximum.y/2 } # FIXME: Factor out this machine size parameter
	
	# Finish Z-Hop
	G91
	G0 Z-0.2
    {% else %}
    	RESPOND MSG="ERROR: Cannot move { 'active_extruder' } into filament-load position."
    {% endif %}

[gcode_macro _PARK_JOBDONE]
# Park the axes so that the operator can unload the machine
gcode:
    T0
    PARK_T0
    T1
    PARK_T1
    G0 Y{printer.configfile.settings["stepper_y"]["position_max"]|float - 0.1} F{printer.toolhead.max_velocity * 60.0 + 0.1}
    G0 Z{printer.configfile.settings["stepper_z"]["position_max"]|float - 0.1} F{printer.toolhead.max_velocity * 60.0 + 0.1}



#####
# Tool Changes
#####

[gcode_macro T0]
description: Activate the T0 (extruder, left)
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    SAVE_GCODE_STATE NAME=t0_state
    {% if printer.toolhead.extruder != 'extruder' and ffcp2.mode|upper in ["IDLE", "TOOLCHANGER", "T0"] %}
        # Deactivate old toolhead
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1  # Set T1 to move independently
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=0
        PARK_T1

        # Activate New toolhead
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 to move independently
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        _APPLY_PART_FAN_ACTIVE
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
    {% endif %}
    RESTORE_GCODE_STATE NAME=t0_state
    OFFSET_T0


[gcode_macro T1]
description: Activate the T1 (extruder1, right)
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    SAVE_GCODE_STATE NAME=t1_state
    {% if printer.toolhead.extruder != 'extruder1' and ffcp2.mode|upper in ["IDLE", "TOOLCHANGER", "T1"] %}
        # Decactivate old toolhead
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 to move independently
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=0
        PARK_T0

        # Activate new toolhead
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1  # Set T1 move independently
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1
        _APPLY_PART_FAN_ACTIVE
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1
    {% endif %}
    RESTORE_GCODE_STATE NAME=t1_state
    OFFSET_T1

[gcode_macro TMIRROR]
description: Select both T0 and T1 in mirror mode
gcode:
    # Manage State
    SAVE_GCODE_STATE NAME=tboth_mirror_state

    # Send both heads home
    PARK_T0
    PARK_T1

    # Sync motions T0 -> T1
    # Since both extruders are in home positions, the positioning steps used in copy mode are not necessary here.
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=mirror # Set T1 motion to follow T0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 move independently
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder  # Set T1 to follow T0
    
    # Monitor both filament sensors
    SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

    # Manage state
    # As much as I'd like to move the head back to where it was with MOVE=1,
    # it's safer to leave it parked here and let the gcode tell us what to do
    # next.
    RESTORE_GCODE_STATE NAME=tboth_mirror_state MOVE=0


[gcode_macro TCOPY]
description: Select both T0 and T1 in copy mode
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    # Manage State
    SAVE_GCODE_STATE NAME=tboth_copy_state

    # Position T0
    PARK_T0
    {% set t0_x = printer.gcode_move.gcode_position.x|float %}  # Record the current X-position of T0.

    # Position T1 relative to T0 for copy mode
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    G1 X{t0_x + ffcp2.copy_offset_x} F{printer.toolhead.max_velocity * 60.0} # Position T1 relative to T0

    # Sync motions T0 -> T1
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=copy # Set T1 motion to follow T0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 move independently
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder  # Set T1 to follow T0

    # Monitor both filament sensors
    SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

    # Manage state
    # As much as I'd like to move the head back to where it was with MOVE=1,
    # it's safer to leave it parked here and let the gcode tell us what to do
    # next.
    RESTORE_GCODE_STATE NAME=tboth_copy_state MOVE=0


#####
# Heating and Cooling
#####

[gcode_macro _NOZZLE_HOT_ACTIVE]
description: Helper macro to ensure that the nozzle is hot enough to perform filament-management functions like loading, unloading, wiping, or priming.
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    RESPOND type=echo MSG="_NOZZLE_HOT_ACTIVE printer.print_stats.state={printer.print_stats.state}"
    RESPOND type=echo MSG="_NOZZLE_HOT_ACTIVE printer.extruder.target={printer.extruder.target}"
    RESPOND type=echo MSG="_NOZZLE_HOT_ACTIVE printer.extruder1.target={printer.extruder1.target}"

    # How hot should the active nozzle be?
    {% if printer.extruder.target|int > 200 %}
       # If the operator or gcode selected a sane temperature, go with it
       {% set target_temp = printer.extruder.target|int %}
    {% else %}
       # The operator did not select a temperature, so let's go with the machine's default
       {% set target_temp  = ffcp2.load_filament_extruder_temp|int %}
    {% endif %}

    # Ensure the nozzle is hot
    M104 S{target_temp}
    M109 S{target_temp}


[gcode_macro _APPLY_PART_FAN_ACTIVE]
variable_part_fan_speed = 0
description: Set the active part fan fan speed, shut down all others. Usage: _PART_FAN_ACTIVE [S<speed>]
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set part_fan_speed=(printer["gcode_macro _APPLY_PART_FAN_ACTIVE"].part_fan_speed) %}

    {% if 'S' in params %}
        SET_GCODE_VARIABLE MACRO=_APPLY_PART_FAN_ACTIVE VARIABLE=part_fan_speed VALUE={params.S|default(255)|float / 255.0}
        {% set part_fan_speed=(params.S|default(255)|float / 255.0) %}
    	#RESPOND type=echo MSG="part_fan_speed={params.S|default(255)|float / 255.0}"
    {% endif %}

    #RESPOND type=echo MSG="_APPLY_PART_FAN_ACTIVE mode={ffcp2.mode}"
    {% if ffcp2.mode|upper in (['COPY', 'MIRROR']) %}
        # In COPY or MIRROR mode, apply speed to both fans
        #RESPOND type=echo MSG="Setting T0,T1 part fan speed"
        SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
        SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
    {% elif ffcp2.mode|upper in (['TOOLCHANGER', 'T0', 'T1', 'IDLE']) %}
	# In single-tool modes, apply speed to the active extruder
        {% if printer.toolhead.extruder == "extruder" %}
            #RESPOND type=echo MSG="Setting T0 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED=0
        {% elif printer.toolhead.extruder == "extruder1" %}
            #RESPOND type=echo MSG="Setting T1 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED=0
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
        {% else %}
            RESPOND type=error MSG="ERROR: Unable to set part fan speed, no active extruder"
        {% endif %}
    {% else %}
      RESPOND type=error MSG="ERROR: Unknown print mode."
    {% endif %}


# It seems that cura does not control the second fan in copy/mirror mode, so we
# have to take care of that.
[gcode_macro M106]
description: Set Fan Speed. Usage: M106 [S<speed>]
gcode:
    {% if 'P' in params and params.P|int > 1 %}
        # M106 P3 the FFCP2 does not have an enclosure fan: NOOP
        # M106 P2 the FFCP2 does not have an auxilliary fan: NOOP
    {% else %}
        # Since P1 may or may be specified or omitted, we fall through to the part fan.
        {% if 'S' in params %}
            _APPLY_PART_FAN_ACTIVE S={params.S}
        {% else %}
            _APPLY_PART_FAN_ACTIVE S=0
        {% endif %}
   {% endif %}


[gcode_macro M107]
description: Fan Off. Usage: M107 [P<index>]
gcode:
    _APPLY_PART_FAN_ACTIVE S=0


#####
# Filament Management
#####

[gcode_macro LOAD_FILAMENT]
gcode:
    _POSITION_FILAMENTLOAD_ACTIVE
    _NOZZLE_HOT_ACTIVE
   
    RESPOND type=echo MSG="LOAD_FILAMENT printer.print_stats.state={printer.print_stats.state}"

    {% if printer.print_stats.state != "printing" %}
        RESPOND type=echo MSG="Filament loading..."
        G91
        G1 E25 F200
        G90
        M400
        RESPOND type=echo MSG="Filament loading completed."
    {% else %}
        {action_respond_info("Don't load filament during printing!!!")}
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    _POSITION_FILAMENTLOAD_ACTIVE
    _NOZZLE_HOT_ACTIVE
    {% if printer.print_stats.state != "printing" %}
        RESPOND type=echo MSG="Filament unloading..."
        G91
        G1 E+15 F200
        G1 E-50 F600
        G90
        M400
        RESPOND type=echo MSG="Filament unloading completed."
        M400
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}


[gcode_macro PRIME_NOZZLE_ACTIVE]
description: Prime the active nozzle command. Usage: PRIME_NOZZLE_ACTIVE [S<count>]
gcode:
    _POSITION_FILAMENTLOAD_ACTIVE
    _NOZZLE_HOT_ACTIVE

    # Poop
    G1 E30 F150

    # Park
    PARK_ACTIVE


[gcode_macro CLEAN_NOZZLE_ACTIVE]
description: Clean the active nozzle. Usage: CLEAN_NOZZLE_ACTIVE [S<count>]
gcode:
    {% set clean_count = params.S|default(3)|int %}

    _NOZZLE_HOT_ACTIVE
 
    # Perform the cleaning motion
    {% for i in range(clean_count) %}
      PARK_ACTIVE
      _POSITION_FILAMENTLOAD_ACTIVE
    {% endfor %}

[gcode_macro G12]
description: Clean the active nozzle. Usage: G12 [S<count>]
gcode:
    CLEAN_NOZZLE_ACTIVE {rawparams}



#####
# Calibration
#####
[gcode_macro Z_ENDSTOP_CALIBRATE]
variable_centerx: 105
variable_headwidth: 40
rename_existing: Z_ENDSTOP_CALIBRATE_BASE
gcode:
    # Home all axes
    G28

    # Position Gantry
    G0 Z25
    G0 Y100

    # Position Left Extruder
    SET_DUAL_CARRIAGE CARRIAGE=0
    G0 X{105-40/2}

    # Position Right Extruder
    SET_DUAL_CARRIAGE CARRIAGE=1
    G0 X{105+40/2}

    # Position bed
    G0 Z0
   
    # Inherit the rest
    Z_ENDSTOP_CALIBRATE_BASE


#####
# Job Management
#####
[gcode_macro START_PRINT]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  START_PRINT_T0 {rawparams}


[gcode_macro START_PRINT_T0]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  _START_PRINT_SINGLETOOL {rawparams} TOOL=0


[gcode_macro START_PRINT_T1]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  _START_PRINT_SINGLETOOL {rawparams} TOOL=1


[gcode_macro _START_PRINT_SINGLETOOL]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  # The startup procedure is so similar between START_PRINT_T0 and START_PRINT_T1 that code-sharing makes sense here.
  ### Parameters ###
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}
  {% set TOOL = params.TOOL|default(0)|float %}
  
  ### Lights and Fans ###
  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0  # Preheating light
  M106 S0 ; Reset part-cooling fan

  ### Active Extruder Thermal Control ###
  {% if TOOL == 0 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
  {% elif TOOL == 1 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
  {% else %}
    RESPOND TYPE=error MSG="ERROR: Unknown tool"
  {% endif %}

  ### Thermal Startup ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %}
    RESPOND TYPE=echo MSG="Preheat extruder to {EXTRUDER_TEMP}°C"
    {% if TOOL == 0 %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    {% elif TOOL == 1 %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
    {% endif %}
  {% endif %}

  ### Mechanical Startup ###
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  # Now that motion is active, we can select the tool conventional way.
  {% if TOOL == 0 %}
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"T0"'
    T0
  {% elif TOOL == 1 %}
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"T1"'
    T1
  {% endif %}

  ### Wait for Temperature ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > 0 %}
    {% if TOOL == 0 %}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    {% elif TOOL == 1 %}
      TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    {% endif %}
  {% endif %}
  {% if BED_TEMP > ffcp2.extruder_min_temp %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Now that we're warmed up, set the lights to run-mode
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1  # Operational light


[gcode_macro START_PRINT_MIRROR]
description: Start a mirror-mode print.  Parameters are the same as a single-mode print.
gcode:
  ### Parameters ###
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"IDLE"'

  ### Lighting and Fans ###
  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0
  M106 S0 ; Reset part-cooling fan

  ### Preheat Begin ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T[0-1] to {EXTRUDER_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  ### Preheat Complete ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% endif %}
  {% if BED_TEMP > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Sync motions T0 -> T1
  TMIRROR

  ### Lighting ###
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"COPY"'


[gcode_macro START_PRINT_COPY]
description: Start a copy-mode print.  Parameters are the same as a single-mode print.
gcode:
  # Note: I've chosen to just print in the 2-head overlapping area to keep the cooridnate system simple.
  # An optimization might be to set the corner of the bed to about (-10,0,0) in the slicer and increase
  # the gap here to increase the sizes of the copied objects a bit, but I'm optimizing for easy-to-read
  # code at this point in the process so playing coordinate games in muliple layers of the software 
  # can happen later.
 
  ### Parameters ###
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"IDLE"'

  ### Lighting and Fans ###
  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0
  M106 S0 ; Reset part-cooling fan

  ### Preheat Begin ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T[0-1] to {EXTRUDER_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  ### Preheat Complete ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% endif %}
  {% if BED_TEMP > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  ### Sync T0 and T1 ###
  # We do this after the preheat has been completed so that we don't cook some sport on the build plate.
  TCOPY

  ### Lighting ###
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"COPY"'


[gcode_macro START_PRINT_TOOLCHANGER]
description: Start a multi-tool print.
gcode:
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(55)|float %}
  {% set T0_TEMP = params.T0_TEMP|default(200)|float %}
  {% set T1_TEMP = params.T1_TEMP|default(200)|float %}
  {% set TOOL = params.TOOL|default(0)|int %}  # Select the active nozzle on startuyp

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"IDLE"'

  ### Lights and Fans ###
  SET_LED LED=enclosure_led RED=1.0 GREEN=0.4 BLUE=0.0 WHITE=0
  M106 S0 ; Reset part-cooling fan

  ### Thermal Startup ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if T0_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T0 to {T0_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={T0_TEMP}
  {% endif %}

  {% if T1_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T1 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T1 to {T1_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={T1_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  G28 ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  # Select the active nozzle
  {% if TOOL == 0 %}
    T0
  {% elif TOOL == 1 %}
    T1
  {% else %}
    T0
  {% endif %}

  ### Wait for Temperature ###
  # Nozzle Temperature Barrier
  {% if T0_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T0_TEMP*0.98} MAXIMUM={T0_TEMP*1.02}
  {% endif %}
  {% if T1_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T1 minimum extrude temperature
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={T1_TEMP*0.98} MAXIMUM={T1_TEMP*1.02}
  {% endif %}
  {% if BED_TEMP > 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Now that we're warmed up, set the lights to run-mode
  SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"TOOLCHANGER"'



[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    SET_LED LED=enclosure_led RED=1 GREEN=0 BLUE=0 WHITE=0.2
    PAUSE_BASE
    RESPOND type=echo MSG="Pause Print!!!"
    _POSITION_FILAMENTLOAD # Put the nozzle in a safe place so it doesn't cook the model, plus we're probably going to have to reload the filament.

[gcode_macro RESUME]
description: Pause the actual running print
rename_existing: RESUME_BASE
gcode:
    PAUSE_BASE
    SET_LED LED=enclosure_led RED=1 GREEN=1 BLUE=1 WHITE=1



[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
        # Don't shut off the motors while printing
        # FIXME: look up time from configuration macros
        RESPOND type=echo MSG="Printer has been sitting idle for { (printer.configfile.settings["idle_timeout"]["timeout"]|float) / 60 } mintues."
    {% else %}
        # If we time out, park the axes for easy model-access
        TURN_OFF_HEATERS
        M107 P0 # Turn off fans
        M107 P1
        _PARK_JOBDONE
  	M18 # Turn off Steppers
        SET_LED LED=enclosure_led RED=0 GREEN=0 BLUE=1 WHITE=0.2
    {% endif %}


[gcode_macro END_PRINT]
gcode:
  TURN_OFF_HEATERS
  M107 P0 # Turn off fans
  M107 P1
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"IDLE"'
  _PARK_JOBDONE
  M18 # Turn off Steppers
  SET_LED LED=enclosure_led RED=0 GREEN=1 BLUE=0 WHITE=0.2


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  TURN_OFF_HEATERS
  M107 P0 # Turn off fans
  M107 P1
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"IDLE"'
  _PARK_JOBDONE
  M18 # Turn off Steppers
  CANCEL_PRINT_BASE
  SET_LED LED=enclosure_led RED=1 GREEN=0 BLUE=0 WHITE=0.2

