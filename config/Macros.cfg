# Diagnostics: uncomment individual "# RESPOND ... DEBUG:" lines to enable.


#####
# Basic Motions
######

[gcode_macro G28]
rename_existing: G28.0
description: Autohome. Usage: G28 [X] [Y] [Z]
gcode:
    {% set active_extruder = printer.toolhead.extruder %}
    G28.0 {rawparams}

    ; When homing Y, move it to the middle for easier filament loading/unloading
    {% if (params.X is undefined and params.Z is undefined) or params.Y is defined  %}
        SAVE_GCODE_STATE NAME=g28_state  # We mostly want to save/restore the G90/G91 mode here.
        G90
        G0 Y{printer.toolhead.axis_maximum.y/2}
        RESTORE_GCODE_STATE NAME=g28_state
    {% endif %}

    ; When homing Z, lower it afterwards to prevent crashes and scratches
    {% if (params.X is undefined and params.Y is undefined) or params.Z is defined  %}
        SAVE_GCODE_STATE NAME=g28_state
        G90
        G0 Z5  # Leave some vertical space, save a build-plate
        RESTORE_GCODE_STATE NAME=g28_state
    {% endif %}

    {% if printer.toolhead.extruder != active_extruder %}
        ACTIVATE_EXTRUDER EXTRUDER={active_extruder}
    {% endif %}
    {% if printer.toolhead.extruder == 'extruder' %}
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% else %}
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}

[gcode_macro _MOTORS_ACTIVE_BARRIER]
description: Autohome, but only if necessary. Usage: MOTORS_ACTIVE_BARRIER
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


[gcode_macro PARK_ACTIVE]
description: Park active toolhead(s)
gcode:
    {% set c = printer.dual_carriage %}
    {% if c.carriage_1 in ["COPY", "MIRROR"] %}
        PARK_T0
        PARK_T1
    {% elif c.carriage_1 == "PRIMARY" %}
        PARK_T1
    {% elif c.carriage_0 == "PRIMARY" %}
        PARK_T0
    {% else %}
        {action_raise_error("PARK_ACTIVE: Invalid carriage state")}
    {% endif %}

 
; Park T0 / Primary / Left Extruder
; Park at left endstop
[gcode_macro PARK_T0]
description: Park T0 / Primary / Left Extruder at the left endstop.
gcode:
    SAVE_GCODE_STATE NAME=PARK_T0
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T0 

    ; Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=0

    ; Perform the move
    G90
    G1 X{printer.configfile.settings["stepper_x"]["position_min"]|float+0.5} F{printer.toolhead.max_velocity*60.0}

    ; Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T0 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T0 MOVE=0


; Park T1 / Secondary / Right Extruder
; Park at right endstop
[gcode_macro PARK_T1]
description: Park T1 / Secondary / Right Extruder at the right endstop.
gcode:
    SAVE_GCODE_STATE NAME=PARK_T1
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_T1 

    ; Select the correct carriage
    SET_DUAL_CARRIAGE CARRIAGE=1

    ; Perform the move
    G90
    G1 X{printer.configfile.settings["dual_carriage"]["position_max"]|float-0.5} F{printer.toolhead.max_velocity*60.0}

    ; Restore the state, but leave the heads where we put them
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_T1 MOVE=0
    RESTORE_GCODE_STATE NAME=PARK_T1 MOVE=0


[gcode_macro _CENTER_POSITION]
gcode:
    _POSITION_CENTER {rawparams}

[gcode_macro _POSITION_CENTER]
description: Put both heads together in the center position for Z_ENDSTOP_CALIBRATE and manual calibration steps
gcode:
    # FIXME: Do we want to do any state-management here?
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage= printer.configfile.settings["dual_carriage"] %}

    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: stepper_x.position_max/2={stepper_x.position_max/2}"
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: dual_carriage.safe_distance/2={dual_carriage.safe_distance/2}"
    # RESPOND TYPE=echo MSG="DEBUG: _POSITION_CENTER: X={stepper_x.position_max/2-dual_carriage.safe_distance/2-0.5}"

    {% if ffcp2.mode|upper not in ["MIRROR"] %}
       TMIRROR
    {% endif %}

    G0 X{stepper_x.position_max/2-dual_carriage.safe_distance/2-0.5} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}


[gcode_macro _SERVICE_POSITION]
gcode:
    _POSITION_SERVICE {rawparams}

[gcode_macro _POSITION_SERVICE]
description: Put both heads into the the service position for Z_ENDSTOP_CALIBRATE and manual calibration steps.
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage= printer.configfile.settings["dual_carriage"] %}

    {% if ffcp2.mode|upper not in ["MIRROR"] %}
       TMIRROR
    {% endif %}

    G0 X{stepper_x.position_endstop+printer["gcode_macro _FFCP2"].service_position_offset} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}


# Move the active extruder to the Filament the Filament the Filament the Filament the Filament the Filament the Filament the Filament the Filament Loading Position
[gcode_macro _FILAMENTLOAD_POSITION]
gcode:
    _POSITION_FILAMENTLOAD {rawparams}

[gcode_macro _POSITION_FILAMENTLOAD]
description: Park the active toolhead for LOAD_FILAMENT, UNLOAD_FILAMENT and PAUSE.  This location is a safe place to poop.
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set stepper_x=printer.configfile.settings["stepper_x"] %}
    {% set dual_carriage= printer.configfile.settings["dual_carriage"] %}
    {% set active_extruder = printer.toolhead.extruder %}

    _MOTORS_ACTIVE_BARRIER

    #G0 Z{printer.toolhead.axis_maximum.z-printer.gcode_move.homing_origin.z } F{printer.toolhead.max_velocity * 60.0}
    {% if active_extruder == "extruder1" %}
        # For IDEX with T1 selected or the T1 single-tool mode, we only need to park the active head.
        G0 X{dual_carriage.position_endstop-printer["gcode_macro _FFCP2"].filamentload_position_offset} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}
    {% else %}
        # For IDEX with T0 selected, T0 single-tool-mode, mirror mode, and copy mode
        # FIXE: Do something smart for copy mode.  Can we break the copy setting and resume it at the end?  Maybe some of this logic needs to be in the PAUSE magro?
        G0 X{stepper_x.position_endstop+printer["gcode_macro _FFCP2"].filamentload_position_offset} Y{printer.toolhead.axis_maximum.y/2} F{printer.toolhead.max_velocity*60.0}
    {% endif %}


[gcode_macro _POSITION_JOBDONE]
description: Park the axes so that the operator can unload the machine
gcode:
    #_MOTORS_ACTIVE_BARRIER  # Don't home the axes; FIXME: add a HOME=true/false parameter to _POSITION_JOBDONE
    PARK_T0
    PARK_T1
    G0 Z{printer.toolhead.axis_maximum.z-printer.gcode_move.homing_origin.z } F{printer.toolhead.max_velocity * 60.0}


#####
# Tool Changes
#####

[gcode_macro T0]
description: activate the t0 (extruder, left)
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    {% if ffcp2.mode_lock == false %} # are we allowed to change tools?
        # Manage state
        SAVE_GCODE_STATE NAME=t0_state

        # Deactivate old toolhead(s)
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY  # disconnect mirror/copy relationship
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1  # disconnect mirror/copy relationship
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=0
        park_t1

        # Activate new toolhead
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # disconnect mirror/copy relationship
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=primary
        _APPLY_PART_FAN_ACTIVe
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1

        # Manage state
        RESTORE_GCODE_STATE NAME=t0_state
        OFFSET_T0
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode value='"t0"'
    {% endif %}


[gcode_macro T1]
description: Activate the T1 (extruder1, right)
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    {% if ffcp2.mode_lock == False %} # Are we allowed to change tools?
        # Manage State
        SAVE_GCODE_STATE NAME=t1_state

        # Decactivate old toolhead(s)
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY  # Disconnect mirror/copy relationship
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Disconnect mirror/copy relationship
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=0
        PARK_T0

        # Activate new toolhead
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1  # Disconnect mirror/copy relationship
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        _APPLY_PART_FAN_ACTIVE
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1
   
        # Manage State 
        RESTORE_GCODE_STATE NAME=t1_state
        OFFSET_T1
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"T1"'
    {% endif %}

[gcode_macro TMIRROR]
description: Select both T0 and T1 in mirror mode
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    {% if ffcp2.mode_lock == False %} # Are we allowed to change tools?
    	# Manage State
    	SAVE_GCODE_STATE NAME=tboth_mirror_state

    	# Send both heads home
    	PARK_T0
    	PARK_T1

    	# Sync motions T0 -> T1
    	# Since both extruders are in home positions, the positioning steps used in copy mode are not necessary here.
    	SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    	SET_DUAL_CARRIAGE CARRIAGE=1 MODE=mirror # Set T1 motion to follow T0
    	ACTIVATE_EXTRUDER EXTRUDER=extruder
    	SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 move independently
    	SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder  # Set T1 to follow T0
    
    	# Monitor both filament sensors
    	SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
    	SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
    	SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
    	SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

    	# Manage state
    	RESTORE_GCODE_STATE NAME=tboth_mirror_state MOVE=0
    	SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"MIRROR"'
    {% endif %}

[gcode_macro TCOPY]
description: Select both T0 and T1 in copy mode
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    _MOTORS_ACTIVE_BARRIER

    {% if ffcp2.mode_lock == False %} # Are we allowed to change tools?
        # Manage State
        SAVE_GCODE_STATE NAME=tboth_copy_state

        # Position T0
        T0
        #{% set t0_x = printer.gcode_move.gcode_position.x|float %}  # Record the current X-position of T0.
	G0 X0 F{printer.toolhead.max_velocity * 60.0} # Position T0 at the origin

        # Position T1 relative to T0 for copy mode
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
        #ACTIVATE_EXTRUDER EXTRUDER=extruder1
        G1 X{0 + ffcp2.copy_offset_x} F{printer.toolhead.max_velocity * 60.0} # Position T1 relative to T0

        # Sync motions T0 -> T1
        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=copy # Set T1 motion to follow T0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder  # Set T0 move independently
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder  # Set T1 to follow T0

        # Monitor both filament sensors
        SET_FILAMENT_SENSOR SENSOR=extruder_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder_motion ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=extruder1_motion ENABLE=1

        # Manage state
        RESTORE_GCODE_STATE NAME=tboth_copy_state MOVE=0
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE='"COPY"'
    {% endif %}

#####
# Heating and Cooling
#####

[gcode_macro _NOZZLE_HOT_ACTIVE_BARRIER]
description: Helper macro to ensure that the nozzle is hot enough to perform filament-management functions like loading, unloading, wiping, or priming.
gcode:
    # FIXME: support for COPY and MIRROR modes.
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    # How hot should the active nozzle be?
    {% if printer.extruder.target|int > ffcp2.extruder_min_temp %}
       # If the operator or gcode selected a sane temperature, go with it
       {% set target_temp = printer.extruder.target|int %}
    {% else %}
       # The operator did not select a temperature, so let's go with the machine's default
       {% set target_temp  = ffcp2.load_filament_extruder_default_temp|int %}
    {% endif %}

    # Ensure the nozzle is hot
    RESPOND TYPE=echo MSG="Waiting for active nozzle at {target_temp}°C."
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for nozzle {target_temp}C
    {% endif %}
    M104 S{target_temp}
    M109 S{target_temp}
    RESPOND TYPE=echo MSG="Active nozzle ready. Continuing."
    {% if not printer.pause_resume.is_paused %}
        M117 Nozzle ready
    {% endif %}

[gcode_macro _APPLY_PART_FAN_ACTIVE]
variable_part_fan_speed = 0
description: Set the active part fan fan speed, shut down all others. Usage: _PART_FAN_ACTIVE [S<speed>]
gcode:
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
    {% set part_fan_speed=(printer["gcode_macro _APPLY_PART_FAN_ACTIVE"].part_fan_speed) %}

    {% if 'S' in params %}
        SET_GCODE_VARIABLE MACRO=_APPLY_PART_FAN_ACTIVE VARIABLE=part_fan_speed VALUE={params.S|default(255)|float / 255.0}
        {% set part_fan_speed=(params.S|default(255)|float / 255.0) %}
        # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: part_fan_speed={params.S|default(255)|float / 255.0}"
    {% endif %}

    # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: mode={ffcp2.mode}"
    {% if ffcp2.mode|upper in (['COPY', 'MIRROR']) %}
        # In COPY or MIRROR mode, apply speed to both fans
        # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: setting T0 and T1 part fan speeds"
        SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
        SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
    {% elif ffcp2.mode|upper in (['IDEX', 'T0', 'T1', 'IDLE']) %}
	# In single-tool modes, apply speed to the active extruder
        {% if printer.toolhead.extruder == "extruder" %}
            # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: setting T0 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED={part_fan_speed}
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED=0
        {% elif printer.toolhead.extruder == "extruder1" %}
            # RESPOND TYPE=echo MSG="DEBUG: _APPLY_PART_FAN_ACTIVE: setting T1 part fan speed"
            SET_FAN_SPEED FAN=extruder_part_fan SPEED=0
            SET_FAN_SPEED FAN=extruder1_part_fan SPEED={part_fan_speed}
        {% else %}
            RESPOND type=error MSG="ERROR: Unable to set part fan speed, no active extruder"
        {% endif %}
    {% else %}
      RESPOND type=error MSG="ERROR: Unknown print mode."
    {% endif %}


# It seems that cura does not control the second fan in copy/mirror mode, so we
# have to take care of that.
[gcode_macro M106]
description: Set Fan Speed. Usage: M106 [S<speed>]
gcode:
    {% if 'P' in params and params.P|int > 1 %}
        # M106 P3 the FFCP2 does not have an enclosure fan: NOOP
        # M106 P2 the FFCP2 does not have an auxilliary fan: NOOP
    {% else %}
        # Since P1 may or may be specified or omitted, we fall through to the part fan.
        {% if 'S' in params %}
            _APPLY_PART_FAN_ACTIVE S={params.S}
        {% else %}
            _APPLY_PART_FAN_ACTIVE S=0
        {% endif %}
   {% endif %}


[gcode_macro M107]
description: Fan Off. Usage: M107 [P<index>]
gcode:
    _APPLY_PART_FAN_ACTIVE S=0


[gcode_macro M140]
rename_existing: M140.0
description: Set bed temperature (blocking).  S=<target temperature>
gcode:
    {% set target = params.S|default(0)|float %} ; Setpoint: °C target
    {% set actual = printer.heater_bed.temperature|float %} ; Sensor: °C measured
    {% set chamber_floor = [printer["heater_generic chamber_heater"].target|float, printer["heater_generic chamber_heater"].temperature|float]|max %}
    {% set tolerance = 3.0 %} ; Tunable: temperature tolerance

    _MOTORS_ACTIVE_BARRIER

    ; Inherit from the original M140 maco
    M140.0 {rawparams}

    ; Block until the target temperature is reached
    {% if target > 0 and (actual - target)|abs > tolerance and (target > actual or target > chamber_floor + 5) %}
        RESPOND TYPE=echo MSG="Bed temperature {actual|round(1)}°C, target {target|round(1)}°C. Parking toolhead until temperature is nominal."
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for bed {target|round(1)}C
        {% endif %}

        SAVE_GCODE_STATE NAME=m140_state
	SAVE_DUAL_CARRIAGE_STATE NAME=m140_dc_state

        PARK_ACTIVE

        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target - tolerance} MAXIMUM={target + tolerance}

	RESTORE_DUAL_CARRIAGE_STATE NAME=m140_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=m140_state MOVE=1

        RESPOND TYPE=echo MSG="Bed temperature within {tolerance|round(1)}°C of {target|round(1)}°C. Continuing."
        {% if not printer.pause_resume.is_paused %}
            M117 Bed ready
        {% endif %}
    {% endif %}


[gcode_macro M141]
description: Set chamber temperature; wait for heating and conditionally for cooling. S=<target temperature>
gcode:
    {% set target = params.S|default(0)|float %} ; Setpoint: °C target
    {% set actual = printer["heater_generic chamber_heater"].temperature|float %} ; Sensor: °C measured
    {% set bed_temp = printer.heater_bed.temperature|float %}
    {% set tolerance = 3.0 %} ; Tunable: temperature tolerance

    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={target}

    ; Always wait for heating outside tolerance.
    ; For cooling, skip waiting below 30°C or above measured bed temperature + 10°C.
    ; Evaluate temperatures once, when this macro is invoked.
    {% if target > 0 and (actual - target)|abs > tolerance and (target > actual or (target >= 30 and target <= bed_temp + 10)) %}
        _MOTORS_ACTIVE_BARRIER
        RESPOND TYPE=echo MSG="Chamber temperature {actual|round(1)}°C, target {target|round(1)}°C. Parking toolhead until temperature is nominal."
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for chamber {target|round(1)}C
        {% endif %}

        SAVE_GCODE_STATE NAME=m141_state
        SAVE_DUAL_CARRIAGE_STATE NAME=m141_dc_state

        PARK_ACTIVE

        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={target - tolerance} MAXIMUM={target + tolerance}

        RESTORE_DUAL_CARRIAGE_STATE NAME=m141_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=m141_state MOVE=1

        RESPOND TYPE=echo MSG="Chamber temperature within {tolerance|round(1)}°C of {target|round(1)}°C. Continuing."
        {% if not printer.pause_resume.is_paused %}
            M117 Chamber ready
        {% endif %}
    {% elif target == 0 %}
        RESPOND TYPE=echo MSG="Chamber heater off"
    {% else %}
        RESPOND TYPE=echo MSG="Chamber target set to {target|round(1)}°C without waiting."
    {% endif %}


[gcode_macro M191]
variable_bed_temp_target = 0.0
description: Warm or cool the chamber (blocking).  S=<target temperature>
gcode:
    # Parameters
    {% set s = params.S|default(0)|float %} # Setpoint: °C target
    {% set ffcp2 = printer["gcode_macro _FFCP2"] %}

    ## Choose an action ##
    # Heat/cool as fast as we can
    {% if s > 0 %}
	# Parameter S temperature specified, let's go!
        RESPOND TYPE=echo MSG="Waiting for chamber temperature within 7% of {s|round(1)}°C."
        {% if not printer.pause_resume.is_paused %}
            M117 Waiting for chamber {s|round(1)}C
        {% endif %}

        # If the bed isn't being used, use it to help heat up the chamber
	{% if printer.heater_bed.target|float < 1 |float%}
            SET_GCODE_VARIABLE MACRO=M191 VARIABLE=bed_temp_target value={printer.heater_bed.target|float}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={[s,65]|max}  # Use the bed to help heat the chamber, but keep it somewhat close to chamber temperature.
        {% endif %}

	# Use the chamber heater to come up to temperature.
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s}

        # Position the bed for optimum heating, but only if we think it hasn't been positioned by a running gcode.
	# If a tool has been selected, skip this step
        {% if "xyz" not in printer.toolhead.homed_axes or ffcp2.mode == "IDLE"  %}
		_MOTORS_ACTIVE_BARRIER
		#_POSITION_JOBDONE
	{% endif %}

	# Wait for the chamber to come up to temperature
	# Precision of +- 7%
	# The bulk of the time in this procedure is spent here
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={s*0.93} MAXIMUM={s*1.07}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp_target}  # We're done using the bed to heat up the chamber

        RESPOND TYPE=echo MSG="Chamber temperature within 7% of {s|round(1)}°C. Continuing."
        {% if not printer.pause_resume.is_paused %}
            M117 Chamber ready
        {% endif %}

    {% else %}
	# Turn off the chamber heater
        RESPOND TYPE=echo MSG="Chamber heater off"
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}


[gcode_macro CONTROLLED_COOLDOWN]
description: Steadily cool the bed and chamber.  S=<target temperature> R=<rate in °C per minute>
gcode:
    # Parameters
    {% set Bed_temp_finish = params.S|default(0)|float %} # Setpoint: °C target
    {% set Cooling_per_minute = params.R|default(0)|float %} # Rate: °C cooling per minute
    {% set Allowed_to_move = params.MOVE|default(0)|int %} # Rate: °C cooling per minute

    # Temperature Targets & Sensor readings
    {% if printer.heater_bed.target|float > 0 %}
        # If the bed heater is turned on, use the set-point temperature target for our cooling calculations
        {% set Bed_temp_start = printer.heater_bed.target|float %}
    {% else %}
        # If the bed heater is not turned on, use the measured temperature
        {% set Bed_temp_start = printer.heater_bed.temperature|float %}
    {% endif %}

    {% if printer["heater_generic chamber_heater"].target|float > 0 %}
        # If the chamber heater is on, use the set-point target temperature
	{% set Chamber_temp_start = printer["heater_generic chamber_heater"].target|float %}
    {% else %}
        # If the chamber heater is not on, use the measured temperature
	{% set Chamber_temp_start = printer["heater_generic chamber_heater"].temperature|float %}
    {% endif %}

    # Calculations
    {% set cooling_per_second = Cooling_per_minute/60 %}
    {% set seconds = ((Bed_temp_start-Bed_temp_finish)/cooling_per_second)|int %}

    # Do we have any work to do here?
    {% if Bed_temp_start > Bed_temp_finish %}
        RESPOND TYPE=echo MSG="Controlled cooldown: bed target {Bed_temp_start|round(1)} to {Bed_temp_finish|round(1)}°C at {Cooling_per_minute|round(2)}°C/min; nominal ramp duration {seconds}s."
        {% if not printer.pause_resume.is_paused %}
            M117 Controlled cooldown
        {% endif %}

	# Position bed for optimum cooling
	{% if Allowed_to_move > 0 %}
	    # We don't call _MOTORS_ACTIVE_BARRIER here because we almost certainly have a model on the bed, and we don't want to cruch it by homing the axes.
	    _POSITION_JOBDONE
	{% endif %}

	# Turn off the printhead heaters
	SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
	SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0

        # Cooling Loop
	# Cool the bed (primarily) and the chamber (secondarily)
        {% for i in range(seconds) %}
            # Update printer status each ramp step; log every 30 steps.
            # Temperature waits can extend the estimated ramp time.
            {% set mm = ((seconds-i)/60)|int %}
            {% set ss = ((seconds-i)%60)|int %}
            {% if not printer.pause_resume.is_paused %}
                M117 Cooldown {(Bed_temp_start-i*cooling_per_second)|round(1)}C est {"%d:%02d"|format(mm, ss)}
            {% endif %}
            {% if i > 0 and (i % 30) == 0 %}
                RESPOND TYPE=echo MSG="Cooldown bed target {(Bed_temp_start-i*cooling_per_second)|round(1)}°C; estimated ramp time remaining {"%d:%02d"|format(mm, ss)}."
            {% endif %}

            # Manage bed temperature
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={(Bed_temp_start-i*cooling_per_second)}

            # Manage chamber temperature
            {% if (Bed_temp_start-i*cooling_per_second) < Chamber_temp_start %}
		# Chamber temperature follows the bed, once the bed is cooler than ambient
                SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={(Bed_temp_start-i*cooling_per_second)} # Cool the chamber with the bed
            {% else %}
                SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={Chamber_temp_start}  # Otherwise maintain the chamber temperature
            {% endif %}

            # Delay
	    G4 P1000 # Sleep for one second
	    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={(Bed_temp_start-i*cooling_per_second)*1.05} # If real temperature is more than 5% behind what the user asked for, wait for it to sync up.
        {% endfor %}
    {% else %}
        RESPOND type=echo MSG="CONTROLLED_COOLDOWN bed already below target temperature."
    {% endif %}

    # Since we've completed the controlled part of the process, now turn off the heaters
    set_heater_temperature heater=heater_bed target=0
    set_heater_temperature heater=chamber_heater target=0
    {% if Bed_temp_start > Bed_temp_finish %}
        RESPOND TYPE=echo MSG="Controlled cooldown finished; bed and chamber heaters off."
        {% if not printer.pause_resume.is_paused %}
            M117 Controlled cooldown finished
        {% endif %}
    {% endif %}


#####
# Lighting
#####
[delayed_gcode chamber_lights_on_boot]
initial_duration: 1.0
gcode:
  # Attach the template (this is what makes it "continuous")
  SET_LED_TEMPLATE LED=chamber_led TEMPLATE=chamber_led_template

[display_template chamber_led_template]
# Optional tunables / remembered state:
text:
    {% if printer.heater_bed.target|float > 0 and (printer.heater_bed.target|float - printer.heater_bed.temperature|float) > 5 %}
        # Bed Heating lights
        1.0, 0.30, 0.0, 0.5
    {% elif printer["heater_generic chamber_heater"].target|float > 0 and (printer["heater_generic chamber_heater"].target|float - printer["heater_generic chamber_heater"].temperature|float) > 5 %}
        # Heating lights
        1.0, 0.30, 0.0, 0.5
    {% elif printer.extruder.target|float > 0 and (printer.extruder.target|float - printer.extruder.temperature|float) > 5 %}
        # Heating lights
        1.0, 0.30, 0.0, 0.5
    {% elif printer.extruder1.target|float > 0 and (printer.extruder1.target|float - printer.extruder1.temperature|float) > 5 %}
        # Heating lights
        1.0, 0.30, 0.0, 0.5
    {% elif printer.print_stats.state|lower == "printing" %}
        # Running lights
        1.0, 1.0, 1.0, 1.0
    {% elif printer.print_stats.state|lower == "paused" %}
        # Fixme lights
        0.0, 1.0, 1.0, 0.5
    {% elif printer.print_stats.state|lower == "complete" %}
        # Success lights
        0.0, 1.0, 0.0, 0.5
    {% elif printer.print_stats.state|lower == "standby" %}
        # Sleepy lights
        0.0, 0.0, 0.5, 0.25
    {% else %}
        # Covers "error" and "canceled" states.
        # Error lights
        1.0, 0.0, 0.0, 0.5
    {% endif %}



#####
# Filament Management
#####

[gcode_macro LOAD_FILAMENT]
gcode:
    # RESPOND TYPE=echo MSG="DEBUG: LOAD_FILAMENT: state={printer.print_stats.state}"

    {% if printer.print_stats.state != "printing" %}
        # Ensure printer is set up for loading
	_MOTORS_ACTIVE_BARRIER
        _POSITION_FILAMENTLOAD # Find a safe place to poop; FIXME: Ensure that pause/resume puts everything back where it belongs
        _NOZZLE_HOT_ACTIVE_BARRIER # Safe temperature to extude

	# Extrude
        RESPOND TYPE=echo MSG="Filament loading..."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament loading
        {% endif %}
        G91
        G1 E60 F200 # Grab the filament and try to eject enough of it to just barely get rid of the old color.
        G90
        M400
        RESPOND TYPE=echo MSG="Filament loading completed."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament loaded
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="Cannot load filament while printing; pause first."
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% if printer.print_stats.state != "printing" %}
        # Ensure printer is set up for loading
	_MOTORS_ACTIVE_BARRIER
        _POSITION_FILAMENTLOAD # Find a safe place to poop; FIXME: Ensure that pause/resume puts everything back where it belongs
        _NOZZLE_HOT_ACTIVE_BARRIER

	# Retract
        RESPOND TYPE=echo MSG="Filament unloading..."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament unloading
        {% endif %}
        G91
        G1 E+15 F200 # Extrude any heat-creeped filament that might be in the hotend.
        G1 E-45 F600 # Eject the filament as fast as we can
        G90
        M400
        RESPOND TYPE=echo MSG="Filament unloading completed."
        {% if not printer.pause_resume.is_paused %}
            M117 Filament unloaded
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="Cannot unload filament while printing; pause first."
    {% endif %}


[gcode_macro PRIME_NOZZLE_ACTIVE]
description: Prime the active nozzle. Usage: PRIME_NOZZLE_ACTIVE
gcode:
    # FIXME: support for COPY and MIRROR modes.
    _MOTORS_ACTIVE_BARRIER
    _POSITION_FILAMENTLOAD
    _NOZZLE_HOT_ACTIVE_BARRIER

    # Poop
    G1 E30 F150

    # Park
    PARK_ACTIVE


[gcode_macro CLEAN_NOZZLE_ACTIVE]
description: Clean the active nozzle. Usage: CLEAN_NOZZLE_ACTIVE [S<count>]
gcode:
    # FIXME: support for COPY and MIRROR modes.
    {% set clean_count = params.S|default(3)|int %}

    _MOTORS_ACTIVE_BARRIER
    _NOZZLE_HOT_ACTIVE_BARRIER
 
    # Perform the cleaning motion
    {% for i in range(clean_count) %}
      PARK_ACTIVE
      _POSITION_FILAMENTLOAD
    {% endfor %}

[gcode_macro G12]
description: Clean the active nozzle. Usage: G12 [S<count>]
gcode:
    CLEAN_NOZZLE_ACTIVE {rawparams}


;;;;;
; Priming
;;;;;

[gcode_macro PRIME_LINE]
description: Draw a priming line for the active print mode. Usage: PRIME_LINE [X1=20] [X2=70] [Y=0] [Z=0.3] [F=1200] [FLOW=0.075] [E=<computed>]
gcode:
    ; Call after the axes are homed and the nozzle(s) are at temperature.
    ; One line is enough for every mode that uses this macro:
    ;   T0/T1 single-tool: only the active nozzle moves.
    ;   MIRROR/COPY: the second nozzle follows automatically.
    ;
    ; Keep X1..X2 inside the safe overlap of all four modes.  With the
    ; current carriage geometry, X=70 is still more than safe_distance away
    ; from its mirror partner (T1 is at 199-X in mirror mode).
    {% set X1 = params.X1|default(20)|float %}
    {% set X2 = params.X2|default(70)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(0.3)|float %}
    {% set F = params.F|default(1200)|float %}
    {% set FLOW = params.FLOW|default(0.075)|float %}
    {% set travel_f = printer.toolhead.max_velocity * 60.0 %}
    {% set line_length = (X2 - X1)|abs %}
    {% set purge_e = params.E|default(line_length * FLOW)|float %}

    ; Preserve the caller's coordinate/extrusion modes.  MOVE=0 leaves the
    ; nozzle where this macro puts it while restoring G90/G91, M82/M83, etc.
    SAVE_GCODE_STATE NAME=prime_line_state
    G90
    M83

    ; Move to the start of the line, then draw it.
    G1 Z{Z} F600
    G1 X{X1} Y{Y} F{travel_f}
    G1 X{X2} E{purge_e} F{F}

    ; Lift before handing control back to the slicer.  Do not retract here:
    ; the line has already primed the nozzle and the next slicer extrusion
    ; should start from that primed state.
    G1 Z{Z + 1.0} F600

    RESTORE_GCODE_STATE NAME=prime_line_state MOVE=0



#####
# Calibration
#####
[gcode_macro Z_ENDSTOP_CALIBRATE]
rename_existing: Z_ENDSTOP_CALIBRATE_BASE
gcode:
    # Position Bed
    G0 Z5  # Provide a little extra space to save a build-plate

    # Position gantry and heads
    _POSITION_CENTER

    # Inherit the rest
    Z_ENDSTOP_CALIBRATE_BASE


#####
# Job Management
#####
[gcode_macro START_PRINT]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  START_PRINT_T0 {rawparams}


[gcode_macro START_PRINT_T0]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  _START_PRINT_SINGLETOOL {rawparams} TOOL=0


[gcode_macro START_PRINT_T1]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  _START_PRINT_SINGLETOOL {rawparams} TOOL=1


[gcode_macro _START_PRINT_SINGLETOOL]
description: Start a conventional single-tool print.  Be as much like a regular 3D-printer as possible.
gcode:
  # The startup procedure is so similar between START_PRINT_T0 and START_PRINT_T1 that code-sharing makes sense here.
  ### Parameters ###
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}
  {% set TOOL = params.TOOL|default(0)|float %}

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # We'll change the mode to set up the printer
  
  ### Fans ###
  M106 S0 ; Reset part-cooling fan

  ### Active Extruder Thermal Control ###
  {% if TOOL == 0 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
  {% elif TOOL == 1 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
  {% else %}
    RESPOND TYPE=error MSG="ERROR: Unknown tool"
  {% endif %}

  ### Thermal Startup ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %}
    RESPOND TYPE=echo MSG="Preheat extruder to {EXTRUDER_TEMP}°C"
    {% if TOOL == 0 %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    {% elif TOOL == 1 %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
    {% endif %}
  {% endif %}

  ### Mechanical Startup ###
  {% if not printer.pause_resume.is_paused %}
      M117 Homing if needed
  {% endif %}
  _MOTORS_ACTIVE_BARRIER ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  # Now that motion is active, we can select the tool conventional way.
  {% if TOOL == 0 %}
    T0
  {% elif TOOL == 1 %}
    T1
  {% endif %}

  ### Wait for Temperature ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > 0 %}
    {% if TOOL == 0 %}
      {% if not printer.pause_resume.is_paused %}
          M117 Waiting for T0
      {% endif %}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    {% elif TOOL == 1 %}
      {% if not printer.pause_resume.is_paused %}
          M117 Waiting for T1
      {% endif %}
      TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    {% endif %}
  {% endif %}
  {% if BED_TEMP > 0 %}
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for bed
    {% endif %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  {% if not printer.pause_resume.is_paused %}
      M117 Priming
  {% endif %}
  PRIME_LINE

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=True # Force printer to stay in this mode for the duration of the print
  {% if not printer.pause_resume.is_paused %}
      M117 Printing
  {% endif %}


[gcode_macro START_PRINT_MIRROR]
description: Start a mirror-mode print.  Parameters are the same as a single-mode print.
gcode:
  ### Parameters ###
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # We'll change the mode to set up the printer

  ### Fans ###
  M106 S0 ; Reset part-cooling fan

  ### Preheat Begin ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T[0-1] to {EXTRUDER_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  {% if not printer.pause_resume.is_paused %}
      M117 Homing if needed
  {% endif %}
  _MOTORS_ACTIVE_BARRIER ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  ### Preheat Complete ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %}
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for nozzles
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% endif %}
  {% if BED_TEMP > 0 %}
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for bed
    {% endif %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  # Sync motions T0 -> T1
  TMIRROR

  {% if not printer.pause_resume.is_paused %}
      M117 Priming
  {% endif %}
  PRIME_LINE

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=True
  {% if not printer.pause_resume.is_paused %}
      M117 Printing
  {% endif %}


[gcode_macro START_PRINT_COPY]
description: Start a copy-mode print.  Parameters are the same as a single-mode print.
gcode:
  # Note: I've chosen to just print in the 2-head overlapping area to keep the cooridnate system simple.
  # An optimization might be to set the corner of the bed to about (-10,0,0) in the slicer and increase
  # the gap here to increase the sizes of the copied objects a bit, but I'm optimizing for easy-to-read
  # code at this point in the process so playing coordinate games in muliple layers of the software 
  # can happen later.
 
  ### Parameters ###
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(-1)|float %}

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # We'll change the mode to set up the printer

  ### Fans ###
  M106 S0 ; Reset part-cooling fan

  ### Preheat Begin ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T[0-1] to {EXTRUDER_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={EXTRUDER_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  {% if not printer.pause_resume.is_paused %}
      M117 Homing if needed
  {% endif %}
  _MOTORS_ACTIVE_BARRIER ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  ### Preheat Complete ###
  # Nozzle Temperature Barrier
  {% if EXTRUDER_TEMP > ffcp2.extruder_min_temp %}
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for nozzles
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={EXTRUDER_TEMP*0.98} MAXIMUM={EXTRUDER_TEMP*1.02}
  {% endif %}
  {% if BED_TEMP > 0 %}
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for bed
    {% endif %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}

  ### Sync T0 and T1 ###
  # We do this after the preheat has been completed so that we don't cook some sport on the build plate.
  TCOPY

  {% if not printer.pause_resume.is_paused %}
      M117 Priming
  {% endif %}
  PRIME_LINE

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=True
  {% if not printer.pause_resume.is_paused %}
      M117 Printing
  {% endif %}


[gcode_macro START_PRINT_IDEX]
description: Start a multi-tool print.
gcode:
  {% set ffcp2 = printer["gcode_macro _FFCP2"] %}
  {% set BED_TEMP = params.BED_TEMP|default(-1)|float %}
  {% set T0_TEMP = params.T0_TEMP|default(200)|float %}
  {% set T1_TEMP = params.T1_TEMP|default(200)|float %}
  {% set TOOL = params.TOOL|default(0)|int %}  # Select the active nozzle on startuyp

  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # We're in native mode, trust the job g-code to set the print-mode appripriately.

  ### Fans ###
  M106 S0 ; Reset part-cooling fan

  ### Thermal Startup ###
  {% if BED_TEMP > 0 %}
    RESPOND TYPE=echo MSG="Preheat bed to {BED_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
  {% endif %}

  {% if T0_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T0 to {T0_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={T0_TEMP}
  {% endif %}

  {% if T1_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T1 minimum extrude temperature
    RESPOND TYPE=echo MSG="Preheat T1 to {T1_TEMP}°C"
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={T1_TEMP}
  {% endif %}

  ### Mechanical Startup ###
  {% if not printer.pause_resume.is_paused %}
      M117 Homing if needed
  {% endif %}
  _MOTORS_ACTIVE_BARRIER ; Home all Axes
  G90 ; use absolute positioning until otherwise specified
  G92 E0 ; reset extruder
  G1 Z0

  # Select the active nozzle
  {% if TOOL == 0 %}
    T0
  {% elif TOOL == 1 %}
    T1
  {% else %}
    T0
  {% endif %}

  ### Wait for Temperature ###
  # Nozzle Temperature Barrier
  {% if T0_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T0 minimum extrude temperature
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for T0
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T0_TEMP*0.98} MAXIMUM={T0_TEMP*1.02}
  {% endif %}
  {% if T1_TEMP > ffcp2.extruder_min_temp %} # FIXME: look up T1 minimum extrude temperature
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for T1
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={T1_TEMP*0.98} MAXIMUM={T1_TEMP*1.02}
  {% endif %}
  {% if BED_TEMP > 0 %}
    {% if not printer.pause_resume.is_paused %}
        M117 Waiting for bed
    {% endif %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP*0.96} MAXIMUM={BED_TEMP*1.04}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
      M117 Printing
  {% endif %}


[gcode_macro PAUSE]
description: Pause print and report reason and filament sensors
rename_existing: PAUSE_BASE
gcode:
    {% set reason = params.REASON|default("Unspecified", true) %}

    {% if not printer.pause_resume.is_paused %}
        RESPOND TYPE=echo MSG="PAUSE: {reason}"

        PAUSE_BASE

        SAVE_GCODE_STATE NAME=pause_resume_state
        SAVE_DUAL_CARRIAGE_STATE NAME=pause_resume_dc_state
        _POSITION_FILAMENTLOAD

        M117 PAUSED: {reason}
    {% else %}
        RESPOND TYPE=echo MSG="Already paused; additional request: {reason}"
    {% endif %}


[gcode_macro RESUME]
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
    {% if printer.pause_resume.is_paused %}
        # Make sure the nozzle is hot before we resume
        _NOZZLE_HOT_ACTIVE_BARRIER

        # IDEX state-management
        RESTORE_DUAL_CARRIAGE_STATE NAME=pause_resume_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=pause_resume_state MOVE=1

        RESUME_BASE
        _RESUME_STATUS
    {% else %}
        RESUME_BASE
    {% endif %}


[gcode_macro _RESUME_STATUS]
description: Replace the pause message only after a successful resume
gcode:
    # A separate macro reads the updated state after RESUME_BASE executes.
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}


[gcode_macro _IDLE_TIMEOUT]
gcode:
    # RESPOND TYPE=echo MSG="DEBUG: _IDLE_TIMEOUT: state={printer.print_stats.state}"
    {% if printer.print_stats.state == "paused" %}
        # Don't shut off the motors while printing
        # FIXME: Unload the filament after a certain amount of time the way my SV08 does.
        RESPOND TYPE=echo MSG="Idle timeout reached after {((printer.configfile.settings['idle_timeout']['timeout']|float) / 60)|round(1)} minutes; print remains paused."
    {% else %}
        # If we time out, park the axes for easy model-access
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # Printer is idle, mode is changeable
  	SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'" # Printer is idle, mode is changeable
        TURN_OFF_HEATERS
        M107 P0 # Turn off fans
        M107 P1
        _POSITION_JOBDONE
  	M18 # Turn off Steppers
    {% endif %}


[gcode_macro END_PRINT]
gcode:
  TURN_OFF_HEATERS
  M107 P0 # Turn off fans
  M107 P1
  _POSITION_JOBDONE
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # Printer is idle, mode is changeable
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'" # Printer is idle, mode is changeable


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  TURN_OFF_HEATERS
  M107 P0 # Turn off fans
  M107 P1
  _POSITION_JOBDONE
  #M18 # Turn off Steppers
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # Printer is idle, mode is changeable
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'" # Printer is idle, mode is changeable
  CANCEL_PRINT_BASE
