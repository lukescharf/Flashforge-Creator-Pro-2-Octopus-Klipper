#####
# Print Control
#####

[gcode_macro PAUSE]
description: Pause print and report reason and filament sensors
rename_existing: PAUSE_BASE
gcode:
    {% set reason = params.REASON|default("Unspecified", true) %}

    {% if not printer.pause_resume.is_paused %}
        RESPOND TYPE=echo MSG="PAUSE: {reason}"

        PAUSE_BASE

        SAVE_GCODE_STATE NAME=pause_resume_state
        SAVE_DUAL_CARRIAGE_STATE NAME=pause_resume_dc_state
        _POSITION_FILAMENTLOAD

        M117 PAUSED: {reason}
    {% else %}
        RESPOND TYPE=echo MSG="Already paused; additional request: {reason}"
    {% endif %}


[gcode_macro RESUME]
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
    {% if printer.pause_resume.is_paused %}
        # Make sure the nozzle is hot before we resume
        _NOZZLE_HOT_ACTIVE_BARRIER

        # IDEX state-management
        RESTORE_DUAL_CARRIAGE_STATE NAME=pause_resume_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=pause_resume_state MOVE=1

        RESUME_BASE
        _RESUME_STATUS
    {% else %}
        RESUME_BASE
    {% endif %}


[gcode_macro _RESUME_STATUS]
description: Replace the pause message only after a successful resume
gcode:
    # A separate macro reads the updated state after RESUME_BASE executes.
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}


[gcode_macro _IDLE_TIMEOUT]
gcode:
    # RESPOND TYPE=echo MSG="DEBUG: _IDLE_TIMEOUT: state={printer.print_stats.state}"
    {% if printer.print_stats.state == "paused" %}
        # Don't shut off the motors while printing
        # FIXME: Unload the filament after a certain amount of time the way my SV08 does.
        RESPOND TYPE=echo MSG="Idle timeout reached after {((printer.configfile.settings['idle_timeout']['timeout']|float) / 60)|round(1)} minutes; print remains paused."
    {% else %}
        # If we time out, park the axes for easy model-access
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # Printer is idle, mode is changeable
  	SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'" # Printer is idle, mode is changeable
        TURN_OFF_HEATERS
        M107 # Turn off part-cooling fans
        _POSITION_JOBDONE
  	M18 # Turn off Steppers
    {% endif %}


[gcode_macro END_PRINT]
gcode:
  TURN_OFF_HEATERS
  M107 # Turn off part-cooling fans
  _POSITION_JOBDONE
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # Printer is idle, mode is changeable
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'" # Printer is idle, mode is changeable


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M107 # Turn off part-cooling fans
  _POSITION_JOBDONE
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False # Printer is idle, mode is changeable
  SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'" # Printer is idle, mode is changeable
  CANCEL_PRINT_BASE
