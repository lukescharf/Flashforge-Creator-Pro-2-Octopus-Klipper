#####################################################################
#   Print Control
#####################################################################


[gcode_macro PAUSE]
# Pause once, save resume state, and move to the filament-loading position.
#
# Usage: PAUSE REASON="Filament runout"
# Parameters: REASON is display text; default Unspecified, including empty input.
# Behavior: call PAUSE_BASE only on the first pause; repeated requests report
# their reason without overwriting saved G-code and dual-carriage state.
# State: save after PAUSE_BASE; _POSITION_FILAMENTLOAD changes position and may
# home. Heater targets are unchanged. Requires integration-provided PAUSE.
# Safety: use absolute positioning and clear travel; do not home over a model.
description: Pause once, save motion state, and report the reason
rename_existing: PAUSE_BASE
gcode:
    {% set reason = params.REASON | default("Unspecified", true) %}

    {% if not printer.pause_resume.is_paused %}
        RESPOND TYPE=echo MSG="PAUSE: {reason}"

        PAUSE_BASE

        SAVE_GCODE_STATE NAME=pause_resume_state
        SAVE_DUAL_CARRIAGE_STATE NAME=pause_resume_dc_state
        _POSITION_FILAMENTLOAD

        M117 PAUSED: {reason}
    {% else %}
        RESPOND TYPE=echo MSG="Already paused; additional request: {reason}"
    {% endif %}


[gcode_macro RESUME]
# Heat the active nozzle and restore saved motion state before resuming.
#
# Usage: RESUME (parameters are not forwarded to RESUME_BASE)
# Behavior: when paused, wait for _NOZZLE_HOT_ACTIVE_BARRIER, restore carriage
# and G-code state with return moves, then invoke the integration base command.
# When not paused, delegate directly. _RESUME_STATUS reads the resulting state.
# Preconditions: saved pause state and clear return paths. The nozzle barrier
# may change the active heater target; it does not ensure T1 heat in COPY/MIRROR.
# State: heater/fan/sensor settings are not restored by the saved motion state.
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
    {% if printer.pause_resume.is_paused %}
        # Make sure the nozzle is hot before we resume
        _NOZZLE_HOT_ACTIVE_BARRIER

        # IDEX state-management
        RESTORE_DUAL_CARRIAGE_STATE NAME=pause_resume_dc_state MOVE=1
        RESTORE_GCODE_STATE NAME=pause_resume_state MOVE=1

        RESUME_BASE
        _RESUME_STATUS
    {% else %}
        RESUME_BASE
    {% endif %}


[gcode_macro _RESUME_STATUS]
# Read the post-resume state in a separately rendered helper.
# Usage: _RESUME_STATUS (no parameters); only change M117 when no longer paused.
description: Replace the pause message only after a successful resume
gcode:
    # A separate macro reads the updated state after RESUME_BASE executes.
    {% if not printer.pause_resume.is_paused %}
        M117 Printing
    {% endif %}


[gcode_macro _IDLE_TIMEOUT]
# Apply the project's idle policy without interrupting a paused print.
#
# Usage: _IDLE_TIMEOUT (called by [idle_timeout], no parameters)
# Behavior: when print_stats.state is paused, report only; leave heaters and
# motors active. Otherwise unlock/reset mode, turn off heaters and part fans,
# position for unloading, then disable motors.
# Safety: the non-paused branch requires homed axes, absolute positioning, and
# clear travel; it does not home or guard against positioning failures.
description: Preserve paused state or shut down and park an idle printer
gcode:
    # Optional diagnostic: uncomment to report the state used by the policy.
    # RESPOND TYPE=echo MSG="DEBUG: _IDLE_TIMEOUT: state={printer.print_stats.state}"
    {% if printer.print_stats.state == "paused" %}
        # Preserve motors and heater targets while the print is paused.
        # FIXME: Unload the filament after a certain amount of time the way my
        # SV08 does.
        RESPOND TYPE=echo MSG="Idle timeout reached after {((printer.configfile.settings['idle_timeout']['timeout'] | float) / 60) | round(1)} minutes; print remains paused."
    {% else %}
        # If we time out, park the axes for easy model-access
        # Printer is idle, mode is changeable
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False
        # Printer is idle, mode is changeable
        SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'"
        TURN_OFF_HEATERS
        # Turn off part-cooling fans
        M107
        PRESENT_PRINT
        # Turn off Steppers
        M18
    {% endif %}


[gcode_macro END_PRINT]
# Turn off heaters and part cooling, park, then unlock/reset the tracked mode.
# Usage: END_PRINT (no parameters)
# State: leave motors enabled until idle timeout; leave position changed.
# Preconditions: homed axes, absolute positioning, clear travel. No homing or
# overall parsing-state restoration; parking failures abort later commands.
description: Shut off heaters and park after a completed print
gcode:
    TURN_OFF_HEATERS
    # Turn off part-cooling fans
    M107
    PRESENT_PRINT
    # Printer is idle, mode is changeable
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False
    # Printer is idle, mode is changeable
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'"


[gcode_macro CANCEL_PRINT]
# Cancel the print before attempting optional parking.
#
# Usage: CANCEL_PRINT (parameters are not forwarded to CANCEL_PRINT_BASE)
# Behavior: turn off heaters/part cooling, unlock/reset mode, and delegate
# cancellation to the integration base command before any optional movement.
# Parking is selected from the render-time homed_axes snapshot; skip if any
# axis is unhomed. Never home here with a model potentially on the bed.
# State: leave heaters off and position changed if parked; no overall parsing
# state restoration. Homed parking still requires absolute mode and clearance.
description: Cancel the print and park only when all axes are homed
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    # Turn off part-cooling fans
    M107
    # Printer is idle, mode is changeable
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode_lock VALUE=False
    # Printer is idle, mode is changeable
    SET_GCODE_VARIABLE MACRO=_FFCP2 VARIABLE=mode VALUE="'IDLE'"
    CANCEL_PRINT_BASE

    # Cancellation is complete before attempting optional movement.
    # Never home here: a model may still be on the bed.
    {% if "xyz" in printer.toolhead.homed_axes %}
        PRESENT_PRINT
    {% else %}
        RESPOND TYPE=echo MSG="Print cancelled; parking skipped because axes are not homed."
    {% endif %}
